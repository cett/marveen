              schema:
                type: object

  /recall:
    get:
      tags: [recall]
      operationId: getRecall
      summary: Unified recall view (recent memories + daily-log)
      description: The memory portion is tenant-scoped for non-admin callers; the daily-log portion is fleet-wide.
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: tenant
          in: query
          schema:
            type: string
          description: "Admin only: narrow memory results to one tenant"
      responses:
        "200":
          description: Recall payload
          content:
            application/json:
              schema:
                type: object

  /recall/dates:
    get:
      tags: [recall]
      operationId: listRecallDates
      summary: Dates with recall entries for an agent
      parameters:
        - name: agent
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Date list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date

  /autonomy:
    get:
      tags: [autonomy]
      operationId: getAutonomyConfig
      summary: Current autonomy level configuration
      description: |
        Each category carries `level`, `locked`, `maxLevel`, `humanOnly` (a category an agent may never
        decide for itself: the built-in floor plus what an admin marked) and `timeoutMinutes` (null
        means the 24-hour ceiling applies).

        `approvalHumanOnlyEnforce` says whether the human-only approval rule binds on this server
        (`APPROVAL_HUMAN_ONLY_ENFORCE=1`): only then does an approved human-only request prove that a
        person decided it. A caller that relies on such an approval (the email send gate) reads it here.
      responses:
        "200":
          description: Autonomy config
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_at:
                    type: integer
                  categories:
                    type: array
                    items:
                      type: object
                  approvalHumanOnlyEnforce:
                    type: boolean
    post:
      tags: [autonomy]
      operationId: updateAutonomyLevel
      summary: Update autonomy level for a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              description: At least one of `level`, `timeout_minutes` and `human_only` is required.
              properties:
                key:
                  type: string
                  description: The category key
                human_only:
                  type: boolean
                  description: |
                    Mark the category as human-only (`true`) or take the mark off (`false`). Admin only.
                    Taking the mark off needs a person logged in to the dashboard (a global admin session,
                    `403` `human_session_required` for a token) and never works on the built-in floor
                    (`email_send`, `email_standing_recipient`: `403` `human_only_floor`).
                level:
                  type: integer
                  minimum: 1
                  maximum: 3
                timeout_minutes:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 10080
                  description: |
                    How long an approval of this category stays open. `null` clears it back to the
                    24-hour ceiling. Admin only (`403` otherwise).
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /model-profiles:
    get:
      tags: [model-profiles]
      operationId: getModelProfileMap
      summary: Current model-profile-id to model-id mapping
      responses:
        "200":
          description: Model profile map
          content:
            application/json:
              schema:
                type: object
    patch:
      tags: [model-profiles]
      operationId: updateModelProfileMapEntry
      summary: Update the concrete model id a profile resolves to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId, modelId]
              properties:
                profileId:
                  type: string
                  enum: [premium_reasoning, build_strong, analysis_efficient, routine_lowcost]
                modelId:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ---------------------------------------------------------------------------
  # Admin — B2B management (admin:all)
  # ---------------------------------------------------------------------------

  /admin/tenants:
    post:
      tags: [admin-tenants]
      operationId: createTenant
      summary: Create a tenant
      description: |
        Creates a new B2B tenant. Requires `admin:all` role.

        Tenant id rules: `^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$` (3-63 chars).
        Reserved ids (`default`, `admin`, `system`, `root`) are always rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, display_name]
              properties:
                id:
                  type: string
                  description: "Tenant id — `^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$`"
                display_name:
                  type: string
                  maxLength: 120
            example:
              id: acme-corp
              display_name: Acme Corporation
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: "`invalid_value` or `required`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [admin-tenants]
      operationId: listTenants
      summary: List tenants
      description: Returns active tenants. Pass `include_disabled=true` to include disabled ones.
      parameters:
        - name: include_disabled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tenant"
                  total:
                    type: integer

  /admin/tenants/{tenant_id}:
    patch:
      tags: [admin-tenants]
      operationId: updateTenant
      summary: Update a tenant
      description: |
        Partial update — at least one field required. The `default` tenant
        cannot be disabled (`cannot_disable_default_tenant`).
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 120
                disabled:
                  type: boolean
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: "`required`, `invalid_value`, or `not_supported`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [admin-tenants]
      operationId: deleteTenant
      summary: Hard-delete a tenant
      description: |
        Permanently deletes a tenant and all associated data (memories, artifacts,
        users, partner senders, device-key assignments, tenant-keyed cost budgets,
        egress allowlist entries, ideas, vault bindings, import sources with their
        audit log, token usage rows and blackboard history). Agent-keyed rows
        (settings, state, blackboard) of an agent that serves only this tenant are
        deleted; those of an agent that also serves another tenant are kept and
        re-tagged to `default`. API tokens stay as revoked tombstones. The `default`
        tenant cannot be deleted. Requires `admin:all` role.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tenant_id:
                    type: string
                  memories_deleted:
                    type: integer
                  secrets_deleted:
                    type: integer
                  purged:
                    type: object
                    description: Rows removed (or re-tagged, `<table>_retagged`) per table by the tenant-keyed cleanup.
                    additionalProperties:
                      type: integer
                  exclusive_agents:
                    type: array
                    description: Agents that served only this tenant. Their agent-keyed rows were deleted; the agent process, bot and directory are not touched.
                    items:
                      type: string
        "403":
          description: "`forbidden` — cannot delete the default tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/tenants/{tenant_id}/starter-pack:
    get:
      tags: [admin-tenants]
      operationId: getTenantStarterPack
      summary: Read the state of a tenant's starter task
      description: |
        Read-only. Reports the tenant's starter task (a daily summary of the tenant's own memories,
        created as `draft` and disabled) and which agent a create would pick right now. Requires
        `admin:all`; the route also checks the role itself, so it holds in shadow RBAC mode.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStarterPackState"
        "400":
          description: "`invalid_value` - the default tenant has no starter pack"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found` - unknown or disabled tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [admin-tenants]
      operationId: createTenantStarterPack
      summary: Create or repair a tenant's starter task
      description: |
        Creates the tenant's starter task, a daily summary of the tenant's own memories, as `draft`
        and disabled: an admin activates it and then enables it, and nothing is sent before that.
        The task is named `<tenant>-starter-daily-summary` and runs on one agent that serves this
        tenant only. The agent is `agent_id` when given, else the tenant's main agent, else the only
        agent enabled for the tenant. Calling it again never overwrites the task; when the agent
        behind an existing task changed, it re-aims the task and returns it to `draft` and disabled.
        Requires `admin:all`; the route also checks the role itself, so it holds in shadow RBAC mode.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id:
                  type: string
                  description: Agent to run the task; must serve this tenant and no other.
      responses:
        "200":
          description: Nothing was created (the task exists), possibly re-aimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStarterPackResult"
        "201":
          description: The task was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStarterPackResult"
        "400":
          description: "`required` (`agent_id`: no single agent can be chosen) or `invalid_value` (the agent does not serve the tenant, or the default tenant)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`forbidden`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found` - unknown or disabled tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict` - the agent also serves another tenant, or a schedule of that name belongs to another tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users:
    post:
      tags: [admin-tenants]
      operationId: createUser
      summary: Create a dashboard user
      description: Creates a scoped (tenant) or global admin user. Requires `admin:all` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 64
                password:
                  type: string
                  minLength: 12
                role:
                  type: string
                  enum: [viewer, read_only, agent, admin]
                tenant_id:
                  type: string
                  nullable: true
                  description: "Required for non-admin roles; must be null for admin role."
                email:
                  type: string
                  nullable: true
                display_name:
                  type: string
                  nullable: true
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUserPublic"
        "400":
          description: "`invalid_value` or `required`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            `forbidden`. With `APPROVAL_HUMAN_ONLY_ENFORCE=1` and at least one enabled dashboard user,
            only a person logged in as a global admin may create a user: any token, a device key and any
            other session get `code` `human_session_required`. With no enabled user (first run) a bearer
            token still works. Also returned for the tenant and role cross-field rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict` — username already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [admin-tenants]
      operationId: listUsers
      summary: List dashboard users
      description: Returns dashboard users. Pass `tenant_id` to filter by tenant. Requires `admin:all` role.
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: include_disabled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DashboardUserPublic"
                  total:
                    type: integer

  /admin/users/{userId}:
    patch:
      tags: [admin-tenants]
      operationId: updateUser
      summary: Update a dashboard user
      description: |
        Partial update — at least one field required. Validates final state
        (merged submitted + existing) for role/tenant_id consistency.
        Requires `admin:all` role.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [viewer, read_only, agent, admin]
                tenant_id:
                  type: string
                  nullable: true
                password:
                  type: string
                  minLength: 12
                  description: Plain-text password; server hashes it.
                disabled:
                  type: boolean
                email:
                  type: string
                  nullable: true
                display_name:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUserPublic"
        "400":
          description: "`required` or `invalid_value`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            `forbidden`. Self-disable or last-admin protection. With `APPROVAL_HUMAN_ONLY_ENFORCE=1` and at
            least one enabled dashboard user, only a person logged in as a global admin may change a user
            (role, password, disabled): any token, a device key and any other session get `code`
            `human_session_required`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [admin-tenants]
      operationId: deleteUser
      summary: Hard-delete a dashboard user
      description: |
        Permanently removes the user. Cannot delete your own account or the
        last active admin. Requires `admin:all` role.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          description: >
            `forbidden`. Self-delete or last-admin protection. With `APPROVAL_HUMAN_ONLY_ENFORCE=1` and at
            least one enabled dashboard user, only a person logged in as a global admin may delete a user:
            any token, a device key and any other session get `code` `human_session_required`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/partner-senders:
    post:
      tags: [admin-partner-senders]
      operationId: createPartnerSender
      summary: Register a partner sender
      description: |
        Adds a sender id to the tenant allowlist. The `sender_id` is sanitized
        before storage (kept chars: `[a-zA-Z0-9_-]`, max 63 chars after sanitization).

        Two 409 cases:
        - `conflict` with `hint: "sender_id_is_fleet_agent"` — the id collides with a registered fleet
          agent name; pick a different sender id.
        - `conflict` with `hint: "partner_sender_already_exists"` — an active or soft-disabled record
          already exists for this `(sender_id, tenant_id)` pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_id, tenant_id]
              properties:
                sender_id:
                  type: string
                  description: "`[a-zA-Z0-9_-]`, 1-63 chars"
                tenant_id:
                  type: string
                display_name:
                  type: string
            example:
              sender_id: acme-bot
              tenant_id: acme-corp
              display_name: Acme Integration Bot
      responses:
        "201":
          description: Partner sender created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSender"
        "400":
          description: "`invalid_value`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found` (tenant does not exist or is disabled)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [admin-partner-senders]
      operationId: listPartnerSenders
      summary: List partner senders
      description: |
        Returns all partner senders. Filter by tenant with `?tenant_id=<id>`.
        Includes both active and soft-disabled records.
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Partner sender list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PartnerSender"
                  total:
                    type: integer

  /admin/partner-senders/{sender_id}:
    delete:
      tags: [admin-partner-senders]
      operationId: disablePartnerSender
      summary: Disable a partner sender (soft-delete)
      description: |
        Sets `disabled_at` on the record — the row is retained in the database.
        Requires `?tenant_id=<id>` query parameter.
      parameters:
        - name: sender_id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
          description: Tenant the sender belongs to
      responses:
        "200":
          description: Sender disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: "`required` — missing `?tenant_id=` query parameter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found` — not found or already disabled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/agent-availability:
    get:
      tags: [admin]
      operationId: getAgentAvailability
      summary: List agent availability for a tenant
      description: Returns enabled/disabled status for every known agent for the given tenant. Deny-by-default — an absent row means disabled.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent availability list
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, items]
                properties:
                  tenant_id:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      required: [agent_id, enabled, updated_at]
                      properties:
                        agent_id:
                          type: string
                        enabled:
                          type: boolean
                        updated_at:
                          type: integer
        "400":
          description: "`bad_request` — missing tenant_id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [admin]
      operationId: setAgentAvailability
      summary: Enable or disable an agent for a tenant
      description: >-
        Enabling an agent (`enabled: true`) for a non-default tenant is
        refused with 409 if the agent's `.mcp.json` carries an MCP server
        with no tenant concept of its own (GitHub, GitLab, Hetzner,
        filesystem, or a GA4 instance) — resubmit with `confirm: true` to
        proceed once acknowledged. Disabling an agent, and assignments to
        the `default` tenant, are never gated. See
        docs/user-guide/en/15-users.md.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, agent_id, enabled]
              properties:
                tenant_id:
                  type: string
                agent_id:
                  type: string
                enabled:
                  type: boolean
                confirm:
                  type: boolean
                  description: >-
                    Acknowledges the fleet-only-agents tenant-isolation
                    warning (see the 409 response below). Ignored unless a
                    prior request without it was refused.
      responses:
        "200":
          description: Updated availability row
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, agent_id, enabled, updated_at]
                properties:
                  tenant_id:
                    type: string
                  agent_id:
                    type: string
                  enabled:
                    type: boolean
                  updated_at:
                    type: integer
        "400":
          description: "`bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `conflict` — the agent carries a high-risk MCP server; the
            response body also includes `agent_id`, `tenant_id`, and
            `risky_mcp_servers` (the offending server names). Resubmit with
            `confirm: true` to proceed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/channel-bindings:
    get:
      tags: [admin]
      operationId: listChannelBindings
      summary: List channel-to-tenant bindings
      description: >-
        Which tenant an incoming source (Telegram chat, dashboard chat,
        inter-agent sender) belongs to, per agent. A source without a binding
        is treated as the `default` tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChannelBinding"
                  total:
                    type: integer
    put:
      tags: [admin]
      operationId: setChannelBinding
      summary: Bind a source to a tenant
      description: >-
        Creates the binding, or moves an existing source to another tenant (a
        source belongs to exactly one tenant). A non-default tenant requires the
        agent to be enabled for it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, channel, external_id, tenant_id]
              properties:
                agent_id:
                  type: string
                channel:
                  type: string
                  description: Lowercase channel token, e.g. `telegram`, `slack`, `dashboard`.
                external_id:
                  type: string
                  description: The id the channel reports for the source (chat id, user id, sender id).
                tenant_id:
                  type: string
      responses:
        "200":
          description: The binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelBinding"
        "400":
          description: "`invalid_value` — malformed `channel` or `external_id`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found` — unknown agent, or tenant missing or disabled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict` — the agent is not enabled for this tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [admin]
      operationId: deleteChannelBinding
      summary: Remove a binding
      description: The source falls back to the `default` tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: agent_id
          in: query
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            type: string
        - name: external_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binding removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: "`required` — a query parameter is missing"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found` — no such binding"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/device-keys:
