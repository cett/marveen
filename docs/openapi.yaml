                  type: string

  /workspace:
    get:
      tags: [workspace]
      operationId: listWorkspaceDocs
      summary: List workspace docs
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: tenant
          in: query
          description: Admin-only tenant filter
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [plan, brief, report, notes]
        - name: content_type
          in: query
          schema:
            type: string
            enum: [text, code, binary]
        - name: task_ref
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Workspace doc list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceDoc'
