                type: object

  /overview:
    get:
      tags: [internal]
      operationId: getOverview
      summary: Dashboard overview panel data
      description: >
        Non-admin callers receive only memories and inter-agent messages within
        their own tenant scope. Admin callers see the global view; an optional
        `?tenant=<id>` query parameter narrows the result to a single tenant.
        Fleet-internal counters (token usage, pending approvals, stuck tasks,
        error spans) are always fleet-wide and unaffected by tenant scoping.
      x-internal: true
      parameters:
        - name: tenant
          in: query
          required: false
          description: Admin only -- narrow the overview to a single tenant ID.
          schema:
            type: string
      responses:
        "200":
          description: Overview payload
          content:
            application/json:
              schema:
                type: object
                required: [memories, unreadMessages, activity]
                properties:
                  memories:
                    type: object
                    description: Tenant-scoped memory counts. Present for all authenticated callers.
                    properties:
                      count: { type: integer }
                      categories: { type: integer }
                  unreadMessages:
                    type: integer
                    description: Tenant-scoped unread inter-agent messages.
                  activity:
                    type: array
                    description: Tenant-scoped recent activity feed (last 30 entries, 4h window).
                    items:
                      type: object
                      properties:
                        icon: { type: string }
                        text: { type: string }
                        at: { type: integer, description: Unix timestamp in milliseconds }
                        agent: { type: string }
                  agents:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: object
                    properties:
                      total: { type: integer }
                      running: { type: integer }
                      list: { type: array, items: { type: object } }
                  tasksToday:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  tasksYesterday:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  artifacts:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: object
                    properties:
                      count: { type: integer }
                  skills:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: object
                    properties:
                      count: { type: integer }
                      today: { type: integer }
                  tokensToday:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  pendingApprovals:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  errors4h:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  errorSpans:
                    x-admin-only: true
                    description: >
                      Admin-only. Omitted for non-admin callers. The newest (up to 20) error or
                      timeout spans of the last 4 hours, newest first -- the rows behind `errors4h`.
                      Empty when there are none. A command task that exits with its findings code
                      (a finding, not a failed run) is not an error span.
                    type: array
                    items:
                      type: object
                      properties:
                        trace_id: { type: string }
                        span_id: { type: string }
                        agent_id: { type: string }
                        operation: { type: string, description: "For example `schedule.run` or `http.server`." }
                        status: { type: string, enum: [error, timeout] }
                        start_ms: { type: integer, description: Unix timestamp in milliseconds }
                        duration_ms: { type: integer, nullable: true }
                        detail: { type: string, description: "Short label: the schedule name, or the HTTP method, route template and status." }
                  stuckTasks:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer

