openapi: 3.1.0

info:
  title: Marveen Dashboard API
  version: 1.0.0
  description: |
    Internal REST API for the Marveen fleet dashboard and inter-agent communication.
    All endpoints require a Bearer token (`store/.dashboard-token`).

    **Tiers**
    - Tier 1 (full schema): core inter-agent endpoints — memories, messages, kanban,
      agents, skills, approvals, blackboard, daily-log, skill-usage.
    - Tier 2 (medium): schedules, ideas, artifacts, token-usage, connectors, recall, autonomy,
      model-profiles.
    - Tier 3 (x-internal): status checks, dashboard-internal routes, static assets.

servers:
  - url: http://localhost:3420/api/v1
    description: Canonical API base (v1)
  - url: http://localhost:3420/api
    description: Legacy API base (deprecated, Deprecation + Sunset headers returned)

security:
  - BearerAuth: []

tags:
  - name: memories
    description: Agent memory store (hot/warm/cold/shared tiers)
  - name: messages
    description: Inter-agent message queue
  - name: kanban
    description: Kanban board — cards, comments, labels, projects
  - name: agents
    description: Fleet agent management (CRUD, model, channels, process)
  - name: skills
    description: Skill filesystem read and usage tracking
  - name: approvals
    description: Human-in-the-loop approval requests
  - name: blackboard
    description: Fleet shared status board
  - name: daily-log
    description: Append-only per-agent daily journal
  - name: skill-usage
    description: Skill usage event log and statistics
  - name: schedules
    description: File-based scheduled task management
  - name: ideas
    description: Idea box
  - name: workspace
    description: Fleet-agent working documents (plans, briefs, reports, notes, binary)
  - name: artifacts
    description: DB-backed artifact store
  - name: token-usage
    description: LLM token consumption tracking
  - name: connectors
    description: External data source connectors
  - name: recall
    description: Consolidated recall (memory + daily-log) view
  - name: autonomy
    description: Autonomy level configuration per category
  - name: model-profiles
    description: Deployment-local model-profile-id to model-id mapping
  - name: internal
    description: Dashboard-internal and status endpoints (x-internal)
  - name: admin-tenants
    description: B2B tenant management (requires admin:all role)
  - name: admin-partner-senders
    description: B2B partner sender allowlist management (requires admin:all role)

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token stored in `store/.dashboard-token`

  schemas:
    DashboardUserPublic:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        tenant_id:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          description: Optional contact email. Null if not set.
        display_name:
          type: string
          nullable: true
          description: Optional display name shown in the profile view. Null if not set.
        created_at:
          type: integer
        disabled:
          type: boolean

    UserProfile:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, agent, read_only, viewer]
        tenant_id:
          type: string
          nullable: true
        tenant_display_name:
          type: string
          nullable: true
        session_count:
          type: integer

    UserProfilePatch:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
        tenant_id:
          type: string
          nullable: true

    Schedule:
      type: object
      description: A scheduled task. Every task belongs to a tenant.
      properties:
        name: { type: string }
        description: { type: string }
        prompt: { type: string }
        schedule: { type: string, description: Cron expression }
        agent: { type: string }
        enabled: { type: boolean }
        type: { type: string, enum: [task, heartbeat, command] }
        status: { type: string, enum: [draft, pending_review, live] }
        tenantId:
          type: string
          description: The tenant the task belongs to (`default` unless another was assigned).
        command: { type: string }
        timeoutMs: { type: integer }
        failThreshold: { type: integer }
        skipIfBusy: { type: boolean }
        forceSend: { type: boolean }
        targetSession: { type: string }
        createdAt: { type: integer }
        contentHash:
          type: string
          description: >-
            Fingerprint of the fields an approval covers (prompt, command, type,
            schedule, agent, target session, timeout, fail threshold, busy
            flags). Send it back as `expected_hash` when activating.

    TenantStarterPackResult:
      type: object
      properties:
        ok:
          type: boolean
        tenant_id:
          type: string
        agent:
          type: string
          nullable: true
        state:
          type: string
          enum: [created, ok, retargeted, needs_agent]
        reason:
          type: string
          description: Why no agent could be chosen (state `needs_agent`).
        created:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
                enum: [exists, name_conflict]
        retargeted:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              from:
                type: string
              to:
                type: string
    TenantStarterPackState:
      type: object
      properties:
        tenant_id:
          type: string
        name:
          type: string
        exists:
          type: boolean
        state:
          type: string
          enum: [absent, ok, retarget_pending, needs_agent]
        task:
          type: object
          nullable: true
          properties:
            agent:
              type: string
            status:
              type: string
            enabled:
              type: boolean
        resolution:
          type: object
          properties:
            agent:
              type: string
              nullable: true
            reason:
              type: string
              enum: [explicit, main_agent, single_enabled, tenant_unavailable, not_serving, shared, ambiguous]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            Machine-readable snake_case error token. Canonical values are listed
            in the enum; additional domain-specific tokens may appear in future
            API versions.
          enum:
            - not_found
            - required
            - invalid_value
            - forbidden
            - unauthorized
            - conflict
            - limit_exceeded
            - internal_error
            - parse_error
            - not_supported
            - timeout
            - disabled
            - not_live
            - managed_settings_missing
            - upstream_error
            - sender_not_in_allowlist
            - federation_disabled
            - tenant_required
            - unknown_query_parameter
            - stale_revision
            - status_conflict
        hint:
          type: string
          description: >-
            Optional human-readable debugging note. Present when the server has
            extra context that helps the caller fix the request (e.g. which
            parameter name the filter expects, or why a value was rejected).
            Clients must not rely on its exact text; treat it as informational.
        field:
          type: string
          description: >-
            Name of the request field that caused the validation failure.
            Present on 4xx validation errors when the problem can be attributed
            to a single input field.
      example:
        error: "required"
        field: "agent_id"

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    ChannelBinding:
      type: object
      required: [agent_id, channel, external_id, tenant_id, created_by, created_at, updated_at]
      properties:
        agent_id:
          type: string
        channel:
          type: string
        external_id:
          type: string
        tenant_id:
          type: string
        created_by:
          type: string
        created_at:
          type: integer
        updated_at:
          type: integer

    Memory:
      type: object
      required: [id, agent_id, content, category, created_at, accessed_at]
      properties:
        id:
          type: integer
        agent_id:
          type: string
          description: Owning agent id, or "import" for imported shadow rows
        content:
          type: string
        category:
          type: string
          enum: [hot, warm, cold, shared]
        keywords:
          type: [string, "null"]
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        accessed_at:
          type: integer
          description: Unix timestamp (seconds)
        updated_at:
          type: integer
          description: Unix timestamp (seconds)
        is_stale:
          type: boolean
          description: >
            Only included when agent filter active.
            True when the memory was updated after the agent's last read.
        created_label:
          type: string
          description: Human-readable created_at (localised)
        accessed_label:
          type: string
          description: Human-readable accessed_at (localised)
      example:
        id: 42
        agent_id: "agent-a"
        content: "Kanban board redesign merged 2026-08-22"
        category: "warm"
        keywords: "kanban, design"
        created_at: 1787400000
        accessed_at: 1787486000
        is_stale: false

    WorkspaceDocSearchResult:
      type: object
      required: [id, title, agent_id, tenant_id, type, created_at, updated_at, snippet]
      properties:
        id:
          type: string
        title:
          type: string
        agent_id:
          type: string
        tenant_id:
          type: string
        type:
          type: string
          enum: [plan, brief, report, notes]
        task_ref:
          type: [string, "null"]
        doc_key:
          type: [string, "null"]
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        updated_at:
          type: integer
          description: Unix timestamp (seconds)
        snippet:
          type: string
          nullable: true
          description: >
            FTS5 match-highlighted excerpt of the column that matched best (the title for a title-only hit), matches
            wrapped in `[...]`. Null when that column is empty.
      example:
        id: "doc_abc123"
        title: "Budget-plafon riasztás -- design terv"
        agent_id: "agent-a"
        tenant_id: "default"
        type: "plan"
        task_ref: "670b6218"
        doc_key: null
        created_at: 1789000000
        updated_at: 1789000000
        snippet: "...the [BudgetEntry] amount is measured in tokens..."

    MemoryLink:
      type: object
      required: [src_id, dst_id, weight]
      properties:
        src_id:
          type: integer
        dst_id:
          type: integer
        weight:
          type: number
          minimum: 0
          maximum: 1
        created_at:
          type: integer

    AgentMessage:
      type: object
      required: [id, from_agent, to_agent, content, status, created_at]
      properties:
        id:
          type: integer
        from_agent:
          type: string
        to_agent:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [pending, delivered, done, failed]
        result:
          type: [string, "null"]
        origin_note:
          type: [string, "null"]
          maxLength: 120
        created_at:
          type: integer
        delivered_at:
          type: [integer, "null"]
        completed_at:
          type: [integer, "null"]
        trace_id:
          type: [string, "null"]
        span_id:
          type: [string, "null"]
        refused_reason:
          type: [string, "null"]
          description: Set when status="failed" resulted from an explicit executor refusal (PUT status="refused"), not a delivery/execution error.
        no_session_at:
          type: [integer, "null"]
          description: Unix timestamp (seconds) of the first time the router found the target session absent for this row, while it was still pending. Not a status change.
        envelope:
          type: [string, "null"]
          description: >-
            Free-form JSON text a delegator can attach (typically alongside
            assign=true) to carry config/context the recipient needs to pick
            the task up. No fixed schema enforced yet. Missing on an
            assign=true message only logs a server-side warning, never blocks.
      example:
        id: 3715
        from_agent: "agent-b"
        to_agent: "agent-a"
        content: "feat/zod-config-schema kész -- 23ec40d, 24 teszt zöld"
        status: "pending"
        result: null
        origin_note: null
        created_at: 1787487278

    KanbanCard:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
          description: 8-character hex id
        seq:
          type: integer
          description: Human-facing sequential number
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [planned, in_progress, waiting, done]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assignee:
          type: [string, "null"]
        parent_id:
          type: [string, "null"]
        project:
          type: [string, "null"]
        created_at:
          type: integer
        updated_at:
          type: integer
        dispatched_at:
          type: [integer, "null"]
        blocked_by:
          type: [string, "null"]
          description: Who/why a status="waiting" card stalled getting here, when known. Mirrors the blackboard's blocked_by.
        blocked_reason:
          type: [string, "null"]
        waiting_for:
          type: [string, "null"]
          description: Free-text description of what the card is currently waiting on (e.g. "PR review"). Only meaningful while status="waiting".
        resolved_by:
          type: [string, "null"]
          description: Who closed out a waiting card (moved it off "waiting"), for audit. Not cleared automatically.
      example:
        id: "6df6d262"
        seq: 201
        title: "OpenAPI 3.1 spec elkészítése"
        status: "in_progress"
        priority: "high"
        assignee: "agent-b"

    KanbanComment:
      type: object
      required: [id, card_id, author, content, created_at]
      properties:
        id:
          type: integer
        card_id:
          type: string
        author:
          type: string
        content:
          type: string
        created_at:
          type: integer

    Approval:
      type: object
      required: [id, agent_id, category, action_description, status, created_at]
      properties:
        id:
          type: string
          description: UUID
        agent_id:
          type: string
        category:
          type: string
        action_description:
          type: string
        action_payload:
          type: [string, "null"]
          description: Optional JSON payload for the action
        status:
          type: string
          enum: [pending, approved, rejected, timeout]
        resolved_by:
          type: [string, "null"]
          description: The authenticated resolver; `human:session:<user>` when a human-only request was decided by a dashboard session.
        resolved_via:
          type: [string, "null"]
          enum: [dashboard_session, bearer, null]
          description: How the decision arrived. Null while pending and for rows decided before this field existed.
        human_only:
          type: integer
          enum: [0, 1]
          description: 1 when the category was human-only at the time of the request (a snapshot). Such a request is decided only by a global admin dashboard session when `APPROVAL_HUMAN_ONLY_ENFORCE=1`.
        content_hash:
          type: [string, "null"]
          description: The sha256 (64 lowercase hex) of the exact action the request covers. Null when none was given.
        consumed_at:
          type: [integer, "null"]
          description: When the approval was used up (unix seconds), null while unused. A hash-bound approval is used up at most once.
        consumed_by:
          type: [string, "null"]
          description: The agent whose token used the approval up.
        consumed_ref:
          type: [string, "null"]
          description: The caller's own label for the use (for example the id of the send); the same label repeated by the same agent shortly after is a retry, not a second use.
        used_at:
          type: [integer, "null"]
          description: When the official sender sealed the use (unix seconds), second phase of using an approval up (see `POST /approvals/claim`, `mode` `send`). Null while the approval is unused or only reserved by the send gate.
        used_ref:
          type: [string, "null"]
          description: The sender's own label of that seal; the same label repeated by the same agent shortly after is a retry.
        timeout_at:
          type: [integer, "null"]
        created_at:
          type: integer
        resolved_at:
          type: [integer, "null"]
      example:
        id: "a1b2c3d4-e5f6-..."
        agent_id: "agent-b"
        category: "code_deploy"
        action_description: "Push feat/openapi-spec to origin"
        status: "pending"
        timeout_at: 1787490000
        created_at: 1787486000

    ApprovalList:
      type: object
      required: [items, total, offset, limit, counts, oldest_pending, window_s]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        total:
          type: integer
          description: The number of requests that match the filters, over all pages.
        offset:
          type: integer
        limit:
          type: integer
        counts:
          type: object
          description: The number of requests per status (`pending`, `approved`, `rejected`, `timeout`). Empty for a fleet agent token, which gets no fleet-wide aggregates.
          additionalProperties:
            type: integer
        oldest_pending:
          description: The request that has waited longest for a decision, null when none is pending (always null for a fleet agent token).
          anyOf:
            - $ref: "#/components/schemas/Approval"
            - type: "null"
        window_s:
          type: integer
          description: The length of the use window in seconds (`APPROVAL_CONSUME_WINDOW_S`, default 1800, 60 to 86400), counted from the decision. An approved request that is still unused after this long can no longer be used up; the dashboard marks it as lapsed.

    ApprovalUsed:
      type: object
      required: [ok, replayed, window_s, approval, sig]
      properties:
        ok:
          type: boolean
          enum: [true]
        replayed:
          type: boolean
          description: True when this call repeated an earlier use by the same agent with the same `ref` (a retry of a lost answer); nothing was used up a second time.
        adopted:
          type: boolean
          description: "Only with `mode` `send`. True when the sender took over the send gate's reservation, false when it reserved and sealed in one step (no gate in front)."
        window_s:
          type: integer
          description: The length of the use window in seconds (`APPROVAL_CONSUME_WINDOW_S`, default 1800, 60 to 86400), counted from the decision.
        approval:
          $ref: "#/components/schemas/Approval"
        sig:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            HMAC-SHA256, lowercase hex, of the text `v1|content_hash|category|agent_id|ref|consumed_at` built from the `approval` row (`ref` is its `consumed_ref`, empty when there is none; `consumed_at` is the integer seconds). The key is the 32 random bytes held as 64 hex characters in `store/.claim-signing-key`, which the server creates (mode 0600) and no route returns. The send gate and the official sender recompute it and refuse an answer without a matching `sig`, so a listener that only mirrors the request cannot pass for the dashboard. A replay of the same use carries the same `sig`. With `mode` `send` the text is `v2|content_hash|category|agent_id|used_ref|consumed_at|used_at` instead (`used_ref` is the sender's own `ref`, `used_at` the integer seconds of the seal): a gate's `v1` answer is not valid where the sender expects `v2`, nor the other way round.

    ApprovalRefusal:
      type: object
      required: [error, reason, window_s]
      description: A `409` answer to using an approval up. The row is described by its state only, never by its content.
      properties:
        error:
          type: string
          enum: [conflict]
        reason:
          type: string
          description: |
            Why nothing was used up. `already_consumed`, `not_approved`, `hash_mismatch`, `expired` (decided longer ago than `window_s`),
            `not_human_decided` (approved, but not by a person in a dashboard session) and `wrong_category` (the category has no hash binding)
            apply to both calls. The claim call adds `pending` (a request for this hash is still open), `rejected` and `none` (no request ever existed for this hash),
            and, with `mode` `send` only, `already_used` (the approval was reserved and the use already sealed by a sender run; the gate keeps seeing `already_consumed`).
          enum: [already_consumed, already_used, not_approved, hash_mismatch, expired, not_human_decided, wrong_category, pending, rejected, none]
        window_s:
          type: integer
        approval_id:
          type: string
          description: "With `reason` `pending` (claim only): the open request, so the caller does not open a second one."
        approval:
          type: object
          description: The state of the approval the answer is about. Absent when there is none (`none`, and `wrong_category` on a claim).
          properties:
            id:
              type: string
            status:
              type: string
              enum: [pending, approved, rejected, timeout]
            consumed_at:
              type: [integer, "null"]
            consumed_by:
              type: [string, "null"]
            consumed_ref:
              type: [string, "null"]

    ApprovalForbidden:
      type: object
      required: [error, reason]
      properties:
        error:
          type: string
          enum: [forbidden]
        reason:
          type: string
          enum: [agent_identity_required, agent_mismatch]
          description: "`agent_identity_required`: the token names no agent (the shared token, a session, a device). `agent_mismatch`: the approval was requested by another agent."
        hint:
          type: string

    ApprovalEvent:
      type: object
      required: [id, approval_id, tenant_id, event, created_at]
      properties:
        id:
          type: integer
        approval_id:
          type: string
        tenant_id:
          type: string
        event:
          type: string
          description: What happened, for example `consumed`, `consume_refused`, `bearer_denied`, `owner_unreached`, `created_deduplicated` or `notify_suppressed`.
        reason:
          type: [string, "null"]
        actor:
          type: [string, "null"]
        ref:
          type: [string, "null"]
        created_at:
          type: integer

    BlackboardRow:
      type: object
      required: [id, agent_id, status, summary, updated_at, tenant_id]
      properties:
        id:
          type: string
          description: 8-character hex id
        agent_id:
          type: string
        task_ref:
          type: [string, "null"]
          description: Kanban card id (optional reference)
        status:
          type: string
          enum: [active, done, blocked, stale, assigned]
        summary:
          type: string
          maxLength: 500
        updated_at:
          type: integer
        tenant_id:
          type: string
          description: >-
            Tenant this row is scoped to, derived from the agent's
            tenant_agent_availability assignment. "default" for fleet agents
            with no tenant assignment, "_multi_" for agents shared across
            2+ tenants (visible to admin only).
        blocked_by:
          type: [string, "null"]
          description: Who/why this row is stuck. Only ever non-null while status="blocked" -- cleared automatically the moment status moves away from "blocked".
        blocked_reason:
          type: [string, "null"]
      example:
        id: "b4cda374"
        agent_id: "agent-b"
        task_ref: "6df6d262"
        status: "active"
        summary: "feat/openapi-spec: írja az OpenAPI 3.1 spec-et"
        updated_at: 1787488514
        tenant_id: "default"

    BlackboardRowWithSignal:
      allOf:
        - $ref: "#/components/schemas/BlackboardRow"
        - type: object
          properties:
            signal:
              type: [string, "null"]
              enum: ["a", "b", "ab", null]
              description: |
                Stale-signal computed at query time (no data is modified).
                "a" = agent sent a message recently but blackboard row was not updated (forgot to update).
                "b" = active row unchanged for longer than the configured threshold (completion signal may be lost).
                "ab" = both signals apply.
                null = no signal.
          example:
            id: "b4cda374"
            agent_id: "agent-a"
            task_ref: "card-001"
            status: "active"
            summary: "Working on task"
            updated_at: 1700000000
            signal: "b"
            tenant_id: "default"

    BlackboardHistoryRow:
      type: object
      required: [id, agent_id, status, summary, created_at, tenant_id]
      properties:
        id:
          type: integer
          description: Auto-increment primary key
        agent_id:
          type: string
        task_ref:
          type: [string, "null"]
          description: Kanban card id at the time of the write
        status:
          type: string
          enum: [active, done, blocked, stale, assigned]
        summary:
          type: string
          maxLength: 500
        created_at:
          type: integer
          description: Unix timestamp of when this transition was recorded
        tenant_id:
          type: string
          description: >-
            Tenant this row is scoped to (see BlackboardRow.tenant_id).
        blocked_by:
          type: [string, "null"]
          description: Snapshot of the live row's blocked_by at the time this transition was recorded.
        blocked_reason:
          type: [string, "null"]
        resolved_by:
          type: [string, "null"]
          description: Set only on the transition entry that actually resolved a blocked row (blocked -> non-blocked); null on every other entry.
      example:
        id: 1
        agent_id: "agent-a"
        task_ref: "task-001"
        status: "active"
        summary: "Started"
        created_at: 1700000000
        tenant_id: "default"

    SkillUsageSummaryRow:
      type: object
      required: [skill_name, last_used_at, total_count, count_30d, count_90d]
      properties:
        skill_name:
          type: string
        last_used_at:
          type: integer
          description: Unix timestamp of most recent use
        total_count:
          type: integer
        count_30d:
          type: integer
        count_90d:
          type: integer

    DailyLog:
      type: object
      properties:
        agent_id:
          type: string
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              created_at:
                type: integer

    Tenant:
      type: object
      required: [id, display_name, created_at, disabled_at]
      properties:
        id:
          type: string
          description: "Tenant identifier — 3-63 chars, `^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$`"
        display_name:
          type: string
          maxLength: 120
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        disabled_at:
          type: integer
          nullable: true
          description: Unix timestamp when disabled; null when active

    PartnerSender:
      type: object
      required: [sender_id, tenant_id, display_name, created_by, created_at, disabled_at]
      properties:
        sender_id:
          type: string
          description: "Sanitized sender identifier — `[a-zA-Z0-9_-]`, 1-63 chars"
        tenant_id:
          type: string
        display_name:
          type: string
        created_by:
          type: string
          description: Username of the admin who created this record
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        disabled_at:
          type: integer
          nullable: true
          description: Unix timestamp when soft-deleted; null when active

    WorkspaceDoc:
      type: object
      required: [id, agent_id, tenant_id, title, content_type, type, size_bytes, created_at, updated_at]
      properties:
        id:
          type: string
        agent_id:
          type: string
        tenant_id:
          type: string
        doc_key:
          type: string
          nullable: true
        title:
          type: string
        content:
          type: string
          nullable: true
        content_type:
          type: string
          enum: [text, code, binary]
        type:
          type: string
          enum: [plan, brief, report, notes]
        task_ref:
          type: string
          nullable: true
        size_bytes:
          type: integer
        last_accessed_at:
          type: integer
          nullable: true
        created_at:
          type: integer
        updated_at:
          type: integer
        content_blob_b64:
          type: string
          nullable: true
          description: Base64-encoded binary content (binary docs only, GET /:id response)

    SaveWorkspaceDocInput:
      type: object
      required: [agent_id, title, content_type, type]
      properties:
        agent_id:
          type: string
        doc_key:
          type: string
          nullable: true
          description: If provided, upserts on (agent_id, doc_key)
        title:
          type: string
        content:
          type: string
          nullable: true
        content_type:
          type: string
          enum: [text, code, binary]
        type:
          type: string
          enum: [plan, brief, report, notes]
        task_ref:
          type: string
          nullable: true
        content_blob_b64:
          type: string
          description: Required for binary content_type; base64-encoded blob

# ---------------------------------------------------------------------------
# Paths — Tier 1
# ---------------------------------------------------------------------------
paths:

  # ---- Memories -----------------------------------------------------------

  /memories:
    get:
      tags: [memories]
      operationId: listMemories
      summary: List or search memories
      description: |
        Returns memories for an agent. When `q` is provided, performs hybrid
        vector + keyword search. Without `q`, returns recent memories for the
        agent (or the chat owner when `agent` is omitted), paginated by
        `offset`/`limit` with a real total count.
        Non-admin callers receive only memories within their own tenant scope.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query (triggers hybrid search when present)
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: >
            Pagination offset. Only takes effect for the plain listing (no
            `q`) -- a hybrid/keyword search returns a ranked top-K result and
            ignores this param.
        - name: agent
          in: query
          schema:
            type: string
          description: Agent id filter (preferred over deprecated `agent_id`)
        - name: category
          in: query
          schema:
            type: string
            enum: [hot, warm, cold, shared]
          description: Filter by memory tier
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: mode
          in: query
          schema:
            type: string
            enum: [hybrid, keyword]
            default: hybrid
          description: Search mode (only applies when `q` is set)
        - name: tenant
          in: query
          schema:
            type: string
          description: "Admin only: narrow results to one tenant (omit to see fleet-default scope)"
        - name: include_docs
          in: query
          schema:
            type: string
            enum: ["1"]
          description: >
            Opt-in only, and only takes effect alongside `q` (a search).
            When set to "1", workspace_docs (fleet-agent plans/briefs/reports/
            notes) are searched via the same FTS5 index and included in the
            response, which then switches from a plain array to
            `{ memories, workspace_docs }` -- see the two response schemas
            below. Omitting this param (the default) leaves every existing
            caller's response shape exactly as it was before this feature.
        - name: read_only
          in: query
          schema:
            type: string
            enum: ["1", "true"]
          description: >
            Opt out of the accessed_at side effect a search (`q`) normally
            has. Set to "1" or "true" for audit/inspection reads (e.g. a
            dashboard browsing memories) that should not count as recall
            usage for hot/warm/cold tier promotion. Has no effect on a plain
            listing (no `q`), which never touches accessed_at anyway.
      responses:
        "200":
          description: >
            Paginated memory list for the plain listing (no `q`), a combined
            memories+workspace_docs object when `include_docs=1` is set
            alongside `q`, or a plain array for a search without
            `include_docs` (gzip-compressed when Accept-Encoding includes gzip)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Memory"
                  - type: object
                    required: [memories, workspace_docs]
                    properties:
                      memories:
                        type: array
                        items:
                          $ref: "#/components/schemas/Memory"
                      workspace_docs:
                        type: array
                        items:
                          $ref: "#/components/schemas/WorkspaceDocSearchResult"
                  - type: object
                    required: [memories, total, offset, limit]
                    properties:
                      memories:
                        type: array
                        items:
                          $ref: "#/components/schemas/Memory"
                      total:
                        type: integer
                        description: Total matching rows, unbounded by limit
                      offset:
                        type: integer
                      limit:
                        type: integer
        "400":
          description: Invalid "offset" parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [memories]
      operationId: createMemory
      summary: Save a new memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                agent_id:
                  type: string
                  description: Defaults to MAIN_AGENT_ID when omitted
                content:
                  type: string
                  minLength: 1
                category:
                  type: string
                  enum: [hot, warm, cold, shared]
                  default: warm
                keywords:
                  type: string
                  description: Comma-separated keywords for keyword search
            example:
              agent_id: "agent-a"
              content: "Kanban board redesign shipped 2026-08-22"
              category: "warm"
              keywords: "kanban, design"
      responses:
        "200":
          description: Memory saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
        "400":
          description: Missing content or invalid category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/stats:
    get:
      tags: [memories]
      operationId: getMemoryStats
      summary: Memory tier statistics
      responses:
        "200":
          description: Count per tier + total
          content:
            application/json:
              schema:
                type: object

  /memories/stale:
    get:
      tags: [memories]
      operationId: listStaleMemories
      summary: Memories updated since the agent last read them
      parameters:
        - name: agent_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of stale memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
        "400":
          description: agent_id required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/links:
    get:
      tags: [memories]
      operationId: listMemoryLinks
      summary: Memory graph edges for a set of memory ids or an agent
      parameters:
        - name: ids
          in: query
          schema:
            type: string
          description: Comma-separated memory ids
        - name: agent
          in: query
          schema:
            type: string
          description: Fetch all edges for the agent's top-500 memories
      responses:
        "200":
          description: Edge list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryLink"

  /memories/graph:
    get:
      tags: [memories]
      operationId: getMemoryGraph
      summary: Memory graph — nodes + edges (dashboard graph view)
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: weight_min
          in: query
          schema:
            type: number
            default: 0.75
            minimum: 0
            maximum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            maximum: 500
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                  edges:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryLink"
                  meta:
                    type: object

  /memories/graph/timeline:
    get:
      tags: [memories]
      operationId: getMemoryGraphTimeline
      summary: Temporal memory graph slice for the timeline scrubber
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: integer
          description: Start Unix timestamp
        - name: to
          in: query
          schema:
            type: integer
          description: End Unix timestamp (defaults to now)
        - name: weight_min
          in: query
          schema:
            type: number
            default: 0.75
      responses:
        "200":
          description: Nodes, edges, and timeline events
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                  edges:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryLink"
                  events:
                    type: array
                    items:
                      type: object
                  time_range:
                    type: object
                    properties:
                      min_ts:
                        type: integer
                      max_ts:
                        type: integer
        "400":
          description: from > to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/read-event:
    post:
      tags: [memories]
      operationId: recordMemoryReadEvent
      summary: Record that an agent read one or more memories (explicit read-trace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - description: Single read
                  type: object
                  required: [agent_id, memory_id]
                  properties:
                    agent_id:
                      type: string
                    memory_id:
                      type: integer
                    context:
                      type: string
                      enum: [heartbeat, search, direct]
                - description: Batch read
                  type: object
                  required: [reads]
                  properties:
                    reads:
                      type: array
                      items:
                        type: object
                        required: [agent_id, memory_id]
                        properties:
                          agent_id:
                            type: string
                          memory_id:
                            type: integer
                          context:
                            type: string
                            enum: [heartbeat, search, direct]
      responses:
        "200":
          description: Read event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/resort:
    post:
      tags: [memories]
      operationId: resortMemories
      summary: Run scheduled memory maintenance (tier re-sort + version prune)
      description: Idempotent. Called by the maintenance scheduled task.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                warm_to_cold_days:
                  type: integer
                cold_to_warm_days:
                  type: integer
                min_agents:
                  type: integer
                version_ttl_days:
                  type: integer
      responses:
        "200":
          description: Resort result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
        "500":
          description: Resort failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/import:
    post:
      tags: [memories]
      operationId: importMemories
      summary: Bulk-import memory chunks (AI-categorised when Ollama is available)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chunks]
              properties:
                agent_id:
                  type: string
                chunks:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  imported:
                    type: integer
                  stats:
                    type: object
                    properties:
                      hot:
                        type: integer
                      warm:
                        type: integer
                      cold:
                        type: integer
                      shared:
                        type: integer
        "400":
          description: No chunks provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/backfill:
    post:
      tags: [memories]
      operationId: backfillMemoryEmbeddings
      summary: Backfill vector embeddings for memories that lack them
      responses:
        "200":
          description: Backfill complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
                    type: integer
        "500":
          description: Backfill failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/links/maintain:
    post:
      tags: [memories]
      operationId: maintainMemoryLinks
      summary: Run memory graph link maintenance (re-embed stale, refresh neighbors, prune decayed)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                weight_threshold:
                  type: number
                max_age_seconds:
                  type: integer
      responses:
        "200":
          description: Maintenance result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
                    properties:
                      reembedded: { type: integer }
                      linksCreated: { type: integer }
                      linksFailed:
                        type: integer
                        description: Memories whose links could not be written (their links are rolled back); the run went on without them, see the dashboard log. A few failures still answer 200.
                      memoriesAttempted:
                        type: integer
                        description: Memories the run tried to link, the denominator of linksFailed.
                      linksPruned: { type: integer }
                      orphans: { type: integer }
        "500":
          description: >
            Maintenance failed, or failed for most memories (at least two failed and more than half of
            those attempted, so the cause is the environment, not one memory); the hint says how many.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [memories]
      operationId: getMemory
      summary: Fetch a single memory by id
      parameters:
        - name: include
          in: query
          schema:
            type: string
            enum: [versions]
          description: Pass `versions` to include version history
        - name: agent_id
          in: query
          schema:
            type: string
          description: When set, records a `direct` span-read for this agent
      responses:
        "200":
          description: Memory object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [memories]
      operationId: updateMemory
      summary: Update a memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                category:
                  type: string
                  enum: [hot, warm, cold, shared]
                agent_id:
                  type: string
                keywords:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [memories]
      operationId: deleteMemory
      summary: Delete a memory
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/{id}/versions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [memories]
      operationId: getMemoryVersions
      summary: Version history for a single memory
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /memories/{id}/detail:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [memories]
      operationId: getMemoryDetail
      summary: Memory detail — base data + read-count + neighbors + tier history
      responses:
        "200":
          description: Detail object
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Memory"
                  - type: object
                    properties:
                      read_count:
                        type: integer
                      neighbors:
                        type: array
                        items:
                          type: object
                      tier_history:
                        type: array
                        items:
                          type: object
                      import_meta:
                        type: [object, "null"]
        "404":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---- Messages -----------------------------------------------------------

  /messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: List agent messages
      description: |
        Returns messages filtered by agent, status, and pagination cursor.
        Only `agent`, `status`, `limit`, and `before` are accepted query parameters —
        unknown parameters return 400 to prevent silent filtering bugs.
      parameters:
        - name: agent
          in: query
          schema:
            type: string
          description: Agent mailbox filter (returns messages TO this agent)
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, done, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: before
          in: query
          schema:
            type: integer
          description: Pagination cursor — message id to fetch messages before
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentMessage"
        "400":
          description: Unknown query parameter
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      unknown:
                        type: array
                        items:
                          type: string
                      known:
                        type: array
                        items:
                          type: string
                      hint:
                        type: string

    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send an inter-agent message
      description: |
        Creates a message in the queue for delivery to the target agent's session.
        The `from` field must be a registered fleet agent id (or the owner name).
        Federation addresses use slash notation: `"peer-system/agent-name"`.

        Side effect: when `assign: true` is set and the local recipient has no `active`
        or `blocked` blackboard row, a row with `status: "assigned"` is automatically
        opened. The summary is the first 100 characters of the message content. The
        agent's own `POST /api/blackboard` with `status: "active"` overwrites this row.
        Omitting `assign` or setting it to `false` produces no blackboard side effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, content]
              properties:
                from:
                  type: string
                  description: Sender agent id (registered fleet agent)
                to:
                  type: string
                  description: Recipient agent id, or `"system/agent"` for federation
                content:
                  type: string
                  minLength: 1
                origin_note:
                  type: string
                  maxLength: 120
                  description: Optional attributability tag
                assign:
                  type: boolean
                  default: false
                  description: |
                    When true, opens an "assigned" blackboard row for the local recipient
                    if they have no active or blocked row. Use for deliberate task
                    delegation; omit for replies, notifications, and acknowledgements.
                envelope:
                  description: >-
                    Optional handoff envelope: a string is stored verbatim, any other
                    JSON value is stringified. No fixed schema enforced yet. Sending
                    assign=true with no envelope only logs a server-side warning.
            example:
              from: "agent-b"
              to: "agent-a"
              content: "feat/openapi-spec kész, 23ec40d, Jónás tesztre vár"
      responses:
        "200":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMessage"
        "400":
          description: |
            Missing required fields or invalid federated address.
            `error` is a stable snake_case code; human detail is in `hint`.
            Codes: `required`, `invalid_value`, `federation_disabled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            Sender not authorised.
            `error` is a stable snake_case code; human detail is in `hint`.
            Codes: `sender_reserved`, `federated_sender_not_allowed`,
            `sender_not_in_allowlist`, `unknown_sender`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /messages/threads:
    get:
      tags: [messages]
      operationId: listMessageThreads
      summary: Conversation thread list (sidebar view — one row per peer)
      description: Non-admin callers see only threads within their own tenant scope.
      responses:
        "200":
          description: Thread list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /messages/backlog:
    get:
      tags: [messages]
      operationId: getMessageBacklog
      summary: Pending message backlog per agent (count + age of oldest)
      responses:
        "200":
          description: Backlog summary
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [messages]
      operationId: updateMessageStatus
      summary: Mark a message done, failed, or refused (executor callback)
      description: >-
        Tenant-scoped: a non-admin caller may only update messages that belong
        to its own tenant (a message without a tenant counts as `default`). A
        message of another tenant answers exactly like a missing id (404, same
        body), so message ids cannot be probed across tenants. Admin callers
        are not restricted. The `[Eredmény]` completion notice sent back to the
        delegator is stored in the original message's tenant. A `fleet_agent`
        token (an agent's own token) may only update messages addressed to its
        own agent; another agent's message is a 403. A message closes once:
        closing one that is already `done` or `failed` is a 409
        (`status_conflict`, with `current_status`), the stored result stays
        as the first close left it and no second `[Eredmény]` notice is sent.
        Before this change the second close overwrote the result and sent a
        second notice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [done, failed, refused]
                  description: >-
                    "refused" is an explicit executor decline, stored as
                    status="failed" plus refused_reason (result's text) --
                    the underlying agent_messages.status CHECK constraint
                    only allows pending/delivered/done/failed, so a
                    refused row still reads as "failed" to any consumer
                    filtering on status, distinguished by refused_reason.
                result:
                  type: string
                  description: Short result summary (first 500 chars stored)
            example:
              status: "done"
              result: "feat/openapi-spec pushed, 23ec40d"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "403":
          description: >-
            The token is a fleet_agent token and the message is addressed to
            another agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Message not found, invalid status transition, or the message
            belongs to another tenant (indistinguishable from a missing id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The message is already closed (`done` or `failed`; a refusal is
            stored as `failed`). Nothing was changed and no completion notice
            was sent. Body: `error: status_conflict`, `current_status`, `hint`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---- Kanban -------------------------------------------------------------

  /kanban:
    get:
      tags: [kanban]
      operationId: listKanbanCards
      summary: List kanban cards
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [planned, in_progress, waiting, done]
        - name: assignee
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, normal, high, urgent]
        - name: project
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
          description: Full-text search on title and description
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: tenant
          in: query
          schema:
            type: string
          description: "Admin only: narrow results to one tenant (omit for all-tenant bypass)"
      responses:
        "200":
          description: Card list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KanbanCard"

    post:
      tags: [kanban]
      operationId: createKanbanCard
      summary: Create a new kanban card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [planned, in_progress, waiting, done]
                  default: planned
                priority:
                  type: string
                  enum: [low, normal, high, urgent]
                  default: normal
                assignee:
                  type: string
                parent_id:
                  type: string
                project:
                  type: string
      responses:
        "201":
          description: Card created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanCard"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kanban/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [kanban]
      operationId: getKanbanCard
      summary: Get a single kanban card
      description: >-
        The card with its text and its labels (`labels`). This is how an agent reads the card a kanban dispatch
        message names: the message carries only the id, the assignee, the priority and this read command, not
        the title or the description. A non-admin caller reads only a card of its own tenant.
      responses:
        "200":
          description: Card object, with its labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanCard"
        "404":
          description: Card not found, or a card of another tenant for a non-admin caller (the same answer, so ids cannot be probed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [kanban]
      operationId: updateKanbanCard
      summary: Update kanban card fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                  enum: [low, normal, high, urgent]
                assignee:
                  type: string
                project:
                  type: string
                blocked_by:
                  type: [string, "null"]
                blocked_reason:
                  type: [string, "null"]
                waiting_for:
                  type: [string, "null"]
                  description: What the card is waiting on, meaningful while status="waiting" (see KanbanCard schema).
                resolved_by:
                  type: [string, "null"]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [kanban]
      operationId: deleteKanbanCard
      summary: Delete a kanban card
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kanban/{id}/move:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [kanban]
      operationId: moveKanbanCard
      summary: Move a kanban card to a new status
      description: >-
        With `expected_status` the move is a compare-and-set: the card moves
        only if it is still in that status. If it is not, nothing is written
        (no status change, no history entry, no wake-up message, no parent
        update, no renumbering of the target column) and the answer is a 409
        `status_conflict` with `current_status` and `expected_status`. Without
        it the move is unconditional. A body key that is not listed below is a
        400 (`invalid_value`, `field` = the key), so a misspelt
        `expectedStatus` cannot silently turn the guard off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, actor]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [planned, in_progress, waiting, testing, done]
                actor:
                  type: string
                  description: Agent id of the mover (required for dispatch logic)
                sort_order:
                  type: integer
                  description: Position in the target column (default 0); ignored when `orderedIds` is sent
                orderedIds:
                  type: array
                  items:
                    type: string
                  description: >-
                    The whole target column in its new order. Every listed card
                    gets its sort_order rewritten; for a non-admin caller the
                    list is cut down to cards of its own tenant.
                expected_status:
                  type: string
                  nullable: true
                  enum: [planned, in_progress, waiting, testing, done]
                  description: >-
                    Move only if the card is still in this status (409
                    `status_conflict` otherwise). Absent or null = unconditional.
            example:
              status: "done"
              actor: "agent-b"
              expected_status: "in_progress"
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: >-
            `expected_status` is not a known status, the body is not a JSON
            object, or it carries a key this endpoint does not know
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Card not found, or it belongs to another tenant (indistinguishable
            from a missing id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `expected_status` was sent and the card is in another status.
            Body: `error: status_conflict`, `current_status`,
            `expected_status`, `hint`. Nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kanban/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [kanban]
      operationId: listKanbanCardComments
      summary: List comments on a kanban card
      responses:
        "200":
          description: Comment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KanbanComment"
    post:
      tags: [kanban]
      operationId: addKanbanCardComment
      summary: Add a comment to a kanban card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author, content]
              properties:
                author:
                  type: string
                content:
                  type: string
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KanbanComment"
        "400":
          description: Missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kanban/labels:
    get:
      tags: [kanban]
      operationId: listKanbanLabels
      summary: List all kanban labels
      responses:
        "200":
          description: Label list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags: [kanban]
      operationId: createKanbanLabel
      summary: Create a kanban label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name:
                  type: string
                color:
                  type: string
