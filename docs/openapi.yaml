  /daily-log/dates:
    get:
      tags: [daily-log]
      operationId: listDailyLogDates
      summary: List dates for which the agent has daily-log entries
      parameters:
        - name: agent
          in: query
          schema:
            type: string
          description: Defaults to MAIN_AGENT_ID
      responses:
        "200":
          description: Date list (YYYY-MM-DD strings)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date

  # ---- Skill Usage --------------------------------------------------------

  /skill-usage:
    get:
      tags: [skill-usage]
      operationId: listSkillUsage
      summary: Recent skill usage rows
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
        - name: skill_name
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: integer
          description: Unix timestamp — only rows after this
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        "200":
          description: Usage row list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    agent_id:
                      type: string
                    skill_name:
                      type: string
                    trigger_type:
                      type: string
                      enum: [tool_call, skill_read]
                    session_id:
                      type: [string, "null"]
                    created_at:
                      type: integer
                    source:
                      type: string
                      enum: [skill_tool, read_tool, bash_read, bash_script, api_read]
                      description: >-
                        Usage path that produced the row. Rows written before the column existed
                        are reported with the value derived from trigger_type (tool_call ->
                        skill_tool, skill_read -> read_tool).

    post:
      tags: [skill-usage]
      operationId: recordSkillUsage
      summary: Record a skill usage event (called by PostToolUse hook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, skill_name, trigger_type]
              properties:
                agent_id:
                  type: string
                skill_name:
                  type: string
                trigger_type:
                  type: string
                  enum: [tool_call, skill_read]
                session_id:
                  type: [string, "null"]
                source:
                  type: [string, "null"]
                  enum: [skill_tool, read_tool, bash_read, bash_script, api_read, null]
                  description: >-
                    Optional. skill_tool requires trigger_type tool_call; every other value requires
                    skill_read. A repeat of the same agent_id, skill_name, session_id and source
                    within 60 seconds is recorded once (the call still answers ok).
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Missing required fields, or an invalid trigger_type / source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /skill-usage/summary:
    get:
      tags: [skill-usage]
      operationId: getSkillUsageSummary
      summary: Per-skill usage summary (last_used_at + 30d/90d/all-time counts)
      responses:
        "200":
          description: Summary list ordered by last_used_at DESC
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillUsageSummaryRow"
              example:
                - skill_name: "fleet-dashboard-api"
                  last_used_at: 1787461082
                  total_count: 134
                  count_30d: 45
                  count_90d: 120

  /skill-usage/stats:
    get:
      tags: [skill-usage]
      operationId: getSkillUsageStats
      summary: Aggregated usage counts per skill (dream-engine health endpoint)
      parameters:
        - name: since
          in: query
          schema:
            type: integer
          description: Unix timestamp cutoff (seconds)
      responses:
        "200":
          description: Stats list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ---- Skills -------------------------------------------------------------

  /skills:
    get:
      tags: [skills]
      operationId: listGlobalSkills
      summary: List global skills
      responses:
        "200":
          description: Skill list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    label:
                      type: string
                    description:
                      type: string
                    keywords:
                      type: array
