                        type: string
                    mtime:
                      type: integer

  /skills/local:
    get:
      tags: [skills]
      operationId: listLocalSkills
      summary: List agent-local skills (across all agents)
      responses:
        "200":
          description: Local skill list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ---- Agents -------------------------------------------------------------

  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: List all fleet agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    display_name:
                      type: string
                    model:
                      type: string
                    running:
                      type: boolean
    post:
      tags: [agents]
      operationId: createAgent
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Agent id (ASCII slug)
                display_name:
                  type: string
                model:
                  type: string
                role:
                  type: string
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /agents/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [agents]
      operationId: getAgent
      summary: Get agent configuration and runtime state
      responses:
        "200":
          description: Agent detail
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [agents]
      operationId: updateAgentConfig
      summary: Update agent configuration fields
      description: >-
        Changing `model` to a value different from the agent's configured model
        also clears the agent's model-fallback overlay (the persistent downgrade
        pin kept in `store/model-fallback-state.json`), so an explicit model
        choice supersedes an automatic usage-limit downgrade. Sending the
        unchanged model value leaves an active overlay in place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any writable agent field (see AGENT_PUT_WRITABLE_FIELDS)
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: |
            Validation error or unknown field. `field` names the first rejected
            key; `hint` lists writable fields and any additional rejected keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: Delete an agent
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Tier 2 — medium detail
  # ---------------------------------------------------------------------------

  /schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: List scheduled tasks
      description: >-
        A non-admin caller gets the tasks of its own tenant. An admin gets all
        of them, or those of the tenant picked with `?tenant=`.


        Access to the schedules endpoints: reading needs `schedules:read` and
        writing (create, edit, toggle, run, delete) `schedules:write`, which
        the `admin` and `agent` roles hold (`read_only` and `viewer` only
        read); activation and `tick-status` stay `admin:all`. These permission
        rows only decide anything in `enforce` mode. Independent of the mode, a
        caller that is not an admin is refused with 403 when its account has
        no tenant, and, for any change, when it is a device key or a
        federation principal, or when its tenant is `default` (the fleet's own
        tasks stay with the admins).
      parameters:
        - name: tenant
          in: query
          required: false
          description: >-
            Admin only (ignored for other callers): narrow to this tenant id.
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
        "403":
          description: >-
            Refused: the account has no tenant, or, in `enforce` mode, the role
            lacks `schedules:read`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: Create a scheduled task
      description: >-
        Creates a schedule. Only a human dashboard login creates it as `live`;
        any other caller (including agents on the shared token) gets a `draft`
        that an admin must activate before the runner fires it. `prompt` is
        required for `task` and `heartbeat`; a `command` task needs `command`
        instead and the prompt is optional.


        Every task belongs to a tenant, chosen in this order: (1) an admin names
        it with `tenant_id`; (2) a non-admin caller always gets its own tenant;
        (3) an agent on the shared token that sends `X-Agent-Id` gets the tenant
        of the request it is serving, or its own tenant when it has exactly one;
        (4) a human at the dashboard who names none gets `default`. Anything else
        (the shared token with neither `tenant_id` nor `X-Agent-Id`, or a shared
        agent with no request context) answers 400 `tenant_required`. The
        tenant must exist and not be disabled, and the agent must serve it: a
        tenant other than `default` cannot name the fleet main agent or `all`.
      parameters:
        - name: X-Agent-Id
          in: header
          required: false
          description: >-
            The calling agent's id on the shared token. Self-declared, not
            authentication: the task stays a draft that a person activates.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, schedule]
              properties:
                name:
                  type: string
                  description: Unique task name (sanitized to a slug)
                description:
                  type: string
                prompt:
                  type: string
                  description: Required unless `type` is `command`
                schedule:
                  type: string
                  description: Cron expression (node local TZ, Europe/Budapest)
                agent:
                  type: string
                  description: >-
                    Target agent. Defaults to the main agent on the default
                    tenant; required on any other tenant.
                type:
                  type: string
                  enum: [task, heartbeat, command]
                  default: task
                skipIfBusy:
                  type: boolean
                forceSend:
                  type: boolean
                targetSession:
                  type: string
                command:
                  type: string
                  description: Shell command, required when `type` is `command`
                timeoutMs:
                  type: integer
                  minimum: 1
                  description: Command timeout in milliseconds (command tasks)
                failThreshold:
                  type: integer
                  minimum: 1
                  description: Consecutive failures before an alert (command tasks)
                tenant_id:
                  type: string
                  description: "Admin only (ignored for other callers). The tenant that owns the task."
      responses:
        "200":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                required: [ok, name, status]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  name:
                    type: string
                  status:
                    type: string
                    enum: [draft, live]
        "400":
          description: >-
            Validation error (missing name, prompt, schedule or command, bad
            cron, non-positive timeoutMs or failThreshold), an unknown or
            disabled tenant, an agent that does not serve the tenant, or
            `tenant_required` when the owning tenant cannot be determined, or
            `limit_exceeded` when the tenant already has 20 schedules waiting
            for review (draft or `pending_review`) and the caller's task would
            be one more draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            The caller is not allowed to create schedules: no tenant, a device
            key or federation principal, the default tenant for a non-admin, or,
            in `enforce` mode, a role without `schedules:write`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A schedule with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body or prompt too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules/pending:
    get:
      tags: [schedules]
      operationId: listPendingSchedules
      summary: List tasks due for execution now
      description: >-
        Busy-skipped tasks waiting for a retry. A retry belongs to the tenant of
        its schedule: a tenant caller sees only its own tenant's retries, an admin
        sees all (or those of `?tenant=`).
      parameters:
        - name: tenant
          in: query
          required: false
          description: >-
            Admin only (ignored for other callers): narrow to this tenant id.
          schema:
            type: string
      responses:
        "200":
          description: Due task list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "403":
          description: >-
            Refused: the account has no tenant, or, in `enforce` mode, the role
            lacks `schedules:read`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules/agents:
    get:
      tags: [schedules]
      operationId: listScheduledAgents
      summary: List agents that have scheduled tasks
      description: >-
        A tenant caller only gets the agents that serve its own tenant; an admin
        gets every agent, or those of the tenant picked with `?tenant=`.
      parameters:
        - name: tenant
          in: query
          required: false
          description: >-
            Admin only (ignored for other callers): narrow to this tenant id.
          schema:
            type: string
      responses:
        "200":
          description: The agents a schedule may target
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, label, avatar]
                  properties:
                    name:
                      type: string
                      description: Agent id, the value a schedule's `agent` takes
                    label:
                      type: string
                      description: Display name
                    avatar:
                      type: string
                      description: Avatar URL
        "403":
          description: >-
            Refused: the account has no tenant, or, in `enforce` mode, the role
            lacks `schedules:read`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules/tick-status:
    get:
      tags: [schedules]
      operationId: getScheduleTickStatus
      summary: Scheduler tick liveness (admin-only)
      description: >-
        Whether the schedule-runner's tick loop has stamped its liveness
        marker recently. stale is true when lastTickMs is unknown (no stamp
        yet) or older than the staleness threshold (3 minutes).
      responses:
        "200":
          description: Tick liveness status
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastTickMs:
                    type: integer
                    nullable: true
                  ageSeconds:
                    type: integer
                    nullable: true
                  stale:
                    type: boolean
        "403":
          description: Caller is not admin

  /schedules/pending/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [schedules]
      operationId: cancelPendingScheduleRetry
      summary: Cancel a pending scheduled-task retry
      description: >-
        A tenant caller can only cancel a retry of its own tenant's schedule;
        anything else answers 404.
      responses:
        "200":
          description: Retry cancelled
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            Refused: the account has no tenant, a device key or federation
            principal, the `default` tenant for a non-admin, or, in `enforce`
            mode, a role without `schedules:write`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Retry not found (also for another tenant's retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [schedules]
      operationId: updateSchedule
      summary: Edit a scheduled task
      description: >-
        Only the fields listed in the request body are written; any other key
        (`status`, `tenantId`, `preCheck`, `catchUpMaxAgeMinutes`,
        `stuckAfterMinutes`, `requires`) is ignored, so an edit can never make a
        draft live (that is the activation endpoint) or point the runner at a
        script. `agent` is admin-only (ignored for others) and must serve the
        task's tenant: an agent of another tenant, the fleet main agent on a
        non-default tenant, or `all` on a non-default tenant answers 400.
        `tenant_id` moves the task to another tenant: authenticated admin only
        (403 otherwise), the target must exist and not be disabled, the
        resulting (tenant, agent) pair is re-checked, and the task goes back to
        `draft` so a person re-activates it. A command task cannot be changed to
        another type without `allowTypeChange: true`.


        Needs `schedules:write`.


        Re-review: a caller that is not an authenticated admin (a tenant user,
        a scoped token, an agent on the shared token) who changes
        what a `live` task executes (`prompt`, `command`, `type`, `schedule`,
        `agent`, `targetSession`, `timeoutMs`, `failThreshold`, `skipIfBusy`,
        `forceSend`) sets it to `pending_review`. The change is written, the
        runner stops firing the task, and an admin has to activate it again.
        Resending the stored values, or changing only `description` or
        `enabled`, does not. A task that is already not `live` keeps its status.
        Every edit writes one audit row (`review_requested` or `update`), and a
        task sent back to review notifies the main agent (at most once an hour
        per task).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                prompt: { type: string }
                schedule: { type: string, description: Cron expression }
                agent: { type: string }
                enabled: { type: boolean }
                type: { type: string, enum: [task, heartbeat, command] }
                skipIfBusy: { type: boolean }
                forceSend: { type: boolean }
                targetSession: { type: string }
                command: { type: string }
                timeoutMs: { type: integer, minimum: 1 }
                failThreshold: { type: integer, minimum: 1 }
                allowTypeChange: { type: boolean }
                tenant_id:
                  type: string
                  description: Move the task to this tenant (authenticated admin only; resets the task to draft).
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
                  tenant_id: { type: string, description: Present only after a tenant move. }
                  status:
                    type: string
                    enum: [draft, pending_review]
                    description: >-
                      `draft` after a tenant move; `pending_review` when the edit sent a
                      live task back to review. Absent otherwise.
                  review_required:
                    type: boolean
                    enum: [true]
                    description: Present (true) when the edit sent a live task back to review.
                  changed:
                    type: array
                    items: { type: string }
                    description: The fields that triggered the review. Present with `review_required`.
        "400":
          description: Invalid field, or the (tenant, agent) pair is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            A tenant move by a caller that is not an authenticated admin, or the
            refusals every schedules write can get: no tenant, a device key or
            federation principal, the `default` tenant for a non-admin, or, in
            `enforce` mode, a role without `schedules:write`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Schedule not found (also for a schedule of another tenant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body or prompt too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: Delete a scheduled task
      description: Needs `schedules:write`. Writes one audit row.
      responses:
        "200":
          description: Deleted
        "403":
          description: >-
            Refused: the account has no tenant, a device key or federation
            principal, the `default` tenant for a non-admin, or, in `enforce`
            mode, a role without `schedules:write`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Schedule not found (also for a schedule of another tenant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules/{name}/toggle:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [schedules]
      operationId: toggleSchedule
      summary: Enable or disable a scheduled task
      description: >-
        Needs `schedules:write`. Switching a task on or off never changes its
        review status: a `draft` or `pending_review` task stays held.
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                type: object
                required: [ok, enabled]
                properties:
                  ok: { type: boolean, enum: [true] }
                  enabled: { type: boolean }
        "403":
          description: >-
            Refused: the account has no tenant, a device key or federation
            principal, the `default` tenant for a non-admin, or, in `enforce`
            mode, a role without `schedules:write`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Schedule not found (also for a schedule of another tenant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules/{name}/activate:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [schedules]
      operationId: activateSchedule
      summary: Activate a draft or held scheduled task
      description: >-
        The only way a `draft` or `pending_review` task becomes `live`.
        Authenticated admin only: an agent on the shared token cannot approve
        its own proposal. Pass the `contentHash` the task was listed with as
        `expected_hash`: if the task changed since, nothing is activated and the
        answer is 409 `stale_revision` with the current hash. Needs `admin:all`
        and, on top of that, a signed-in admin; writes one audit row.
      parameters:
        - name: expected_hash
          in: query
          required: false
          schema:
            type: string
          description: The `contentHash` the admin reviewed. Optional; unchecked when omitted.
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok: { type: boolean, enum: [true] }
                  status: { type: string, enum: [live] }
        "403":
          description: Caller is not an authenticated admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The task changed after the caller loaded it (`stale_revision`); the body carries the current `content_hash`
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [stale_revision] }
                  content_hash:
                    type: string
                    description: The task's current `contentHash`; review it and activate again with this value.
                  hint: { type: string }

  /schedules/{name}/runs:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [schedules]
      operationId: listScheduleRuns
      summary: Recent runs of a scheduled task
      responses:
        "200":
          description: The last 10 runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ts:
                      type: integer
                      description: Run time, milliseconds since the epoch
                    status:
                      type: string
                      description: >-
                        Outcome of the run, for example `fired`, `error` or `skipped`. A due
                        occurrence the scheduler held back is recorded instead
                        of run: `skipped_not_live` (a draft, or a task held for a new review),
                        `skipped_disabled` (switched off in a mass event) and
                        `skipped_tenant_mismatch` (the task's tenant and agent
                        no longer fit together: the agent was switched off for
                        the tenant, the tenant was disabled, or the agent is gone).
                    tokens_est:
                      type: integer
                      description: Estimated token use of the run, null when it cannot be estimated
        "403":
          description: >-
            Refused: the account has no tenant, or, in `enforce` mode, the role
            lacks `schedules:read`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Schedule not found (also for a schedule of another tenant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules/{name}/run:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [schedules]
      operationId: runScheduleNow
      summary: Run a scheduled task now (manual run)
      description: >-
        Fires the task immediately, bypassing the cron match, the catch-up
        window and `skipIfBusy`. A disabled task answers 409 `disabled` and a
        draft or `pending_review` task 409 `not_live` (a signed-in admin may
        still run it to preview it). Needs `schedules:write`.


        For prompt-type tasks (`task`, `heartbeat`) the prompt is delivered to
        the target agent session like a cron fire; a stopped agent is started
        and a busy session gets a queued retry. The result is a per-agent
        summary such as `<agent>: fired` (other outcomes: `busy`, `starting`, `missing`, `error`, `mcp-missing`, `first-run`).


        For `type: command` tasks the shell command is run directly, exactly
        as the cron loop does, without an agent session. The call does not wait
        for the command: it answers at once with `command: started (...)`, the
        command runs asynchronously (whole process tree killed on timeout) and
        its outcome is recorded in `store/command-task-health.json`. If the
        previous run of the same command task is still in progress, the new
        run is skipped instead of started twice.
      responses:
        "200":
          description: Run started or delivered
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  result:
                    type: string
                    description: >-
                      Per-agent delivery summary for prompt tasks, or
                      `command: started (outcome in store/command-task-health.json)`
                      for command tasks.
        "400":
          description: Run rejected for another reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            Refused: the account has no tenant, a device key or federation
            principal, the `default` tenant for a non-admin, or, in `enforce`
            mode, a role without `schedules:write`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Schedule not found (also for a schedule of another tenant)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Schedule is disabled (`disabled`) or not live (`not_live`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ideas:
    get:
      tags: [ideas]
