  /kanban/labels:
    get:
      tags: [kanban]
      operationId: listKanbanLabels
      summary: List all kanban labels
      responses:
        "200":
          description: Label list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags: [kanban]
      operationId: createKanbanLabel
      summary: Create a kanban label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name:
                  type: string
                color:
                  type: string
                  description: 6-digit hex color (#rrggbb)
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema:
                type: object

  /kanban-projects:
    get:
      tags: [kanban]
      operationId: listKanbanProjects
      summary: List kanban projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /kanban/assignees:
    get:
      tags: [kanban]
      operationId: listKanbanAssignees
      summary: List all known assignee values
      responses:
        "200":
          description: Assignee list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /kanban/archived:
    get:
      tags: [kanban]
      operationId: listArchivedKanbanCards
      summary: List archived kanban cards
      responses:
        "200":
          description: Archived card list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KanbanCard"

  /kanban/search:
    get:
      tags: [kanban]
      operationId: searchKanbanCards
      summary: Unified text/ID search across active and archived kanban cards
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: >-
            Search text. "#NNN" matches the exact running number, a 4-8 char
            hex string matches an id prefix, anything else matches a
            title/project/assignee substring. Below 2 characters returns an
            empty result (still HTTP 200).
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: >-
            Matching cards, active ones ranked before archived ones, most
            recently updated first within each group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/KanbanCard"
                        - type: object
                          properties:
                            archived:
                              type: boolean
                  total:
                    type: integer
                  active_count:
                    type: integer
                  archived_count:
                    type: integer
                  q:
                    type: string

  /kanban/heartbeat-summary:
    get:
      tags: [kanban]
      operationId: getKanbanHeartbeatSummary
      summary: Compact board summary for heartbeat agents
      responses:
        "200":
          description: Summary object
          content:
            application/json:
              schema:
                type: object

  # ---- Approvals ----------------------------------------------------------

  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approval requests
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, timeout]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"

    post:
      tags: [approvals]
      operationId: createApproval
      summary: Create an approval request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, category, action_description]
              properties:
                agent_id:
                  type: string
                category:
                  type: string
                action_description:
                  type: string
                action_payload:
                  type: string
                  description: Optional JSON payload for the action
                timeout_seconds:
                  type: integer
                  description: |
                    Shorten how long the request stays open. The category's `timeout_minutes`
                    (24 hours for an unknown category or a category without one) is the ceiling:
                    a longer value is capped to it, a missing, zero, negative or non-numeric
                    value is ignored. The response `timeout_at` is always set.
            example:
              agent_id: "agent-b"
              category: "code_deploy"
              action_description: "Push feat/openapi-spec branch to origin"
              timeout_seconds: 3600
      responses:
        "201":
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /approvals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: UUID
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Poll approval status
      responses:
        "200":
          description: Approval object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags: [approvals]
      operationId: resolveApproval
      summary: Resolve an approval (approve / reject / timeout)
      description: Self-approval guard — the requesting agent cannot approve its own request. A request past its `timeout_at` cannot be approved or rejected any more.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolved_by]
              properties:
                status:
                  type: string
                  enum: [approved, rejected, timeout]
                resolved_by:
                  type: string
                telegram_message_id:
                  type: integer
            example:
              status: "approved"
              resolved_by: "agent-a"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Self-approval not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already resolved, or past its deadline (`Approval has expired`; the sweeper then records it as `timeout` with `resolved_by` `system:timeout`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---- Blackboard ---------------------------------------------------------

  /blackboard:
    get:
      tags: [blackboard]
      operationId: listBlackboard
      summary: List fleet blackboard (last 10 rows, newest first)
      description: >-
        Each row includes a computed `signal` field indicating staleness. No data is modified.
        Admin sees every tenant's rows (including agents shared across tenants, `tenant_id: "_multi_"`);
        every other role only sees rows belonging to its own tenant.
      responses:
        "200":
          description: Blackboard rows with stale-signal annotations
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/BlackboardRowWithSignal"
              example:
                - id: "b4cda374"
                  agent_id: "agent-b"
                  task_ref: "6df6d262"
                  status: "active"
                  summary: "feat/openapi-spec: írja a YAML-t"
                  updated_at: 1787488514
                  signal: null

    post:
      tags: [blackboard]
      operationId: upsertBlackboardEntry
      summary: Upsert agent status (one row per agent_id — creates or updates)
      description: >-
        `tenant_id` is derived server-side from the agent's tenant_agent_availability
        assignment and cannot be set by the caller. A non-admin caller may only post
        on behalf of an agent that resolves to their own tenant (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, summary]
              properties:
                agent_id:
                  type: string
                summary:
                  type: string
                  maxLength: 500
                status:
                  type: string
                  enum: [active, done, blocked, stale, assigned]
                  default: active
                task_ref:
                  type: [string, "null"]
                  description: Kanban card id (optional)
                blocked_by:
                  type: [string, "null"]
                  description: Who/why the row is blocked. Only takes effect when status="blocked"; ignored (row's value stays null) otherwise.
                blocked_reason:
                  type: [string, "null"]
                resolved_by:
                  type: [string, "null"]
                  description: Recorded into blackboard/history only on an actual blocked -> non-blocked transition; ignored otherwise.
            example:
              agent_id: "agent-b"
              task_ref: "6df6d262"
              status: "active"
              summary: "feat/openapi-spec: Tier 1 végpontok dokumentálása"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  row:
                    $ref: "#/components/schemas/BlackboardRow"
        "400":
          description: Validation error (missing agent_id/summary, summary > 500 chars, invalid status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Non-admin caller's tenant does not match the target agent's tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /blackboard/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [blackboard]
      operationId: updateBlackboardEntry
      summary: Partially update a blackboard row by id
      description: Admin only (no per-role permission entry maps to this path -- the RBAC gate falls back to admin:all).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, done, blocked, stale, assigned]
                summary:
                  type: string
                  maxLength: 500
                task_ref:
                  type: [string, "null"]
                blocked_by:
                  type: [string, "null"]
                  description: Same status="blocked"-only semantics as POST /blackboard.
                blocked_reason:
                  type: [string, "null"]
                resolved_by:
                  type: [string, "null"]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  row:
                    $ref: "#/components/schemas/BlackboardRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /blackboard/history:
    get:
      tags: [blackboard]
      operationId: listBlackboardHistory
      summary: List blackboard state-transition history (append-only audit trail)
      description: >-
        Admin sees every tenant's history; every other role only sees entries
        belonging to its own tenant (same scoping as GET /blackboard).
      parameters:
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
          description: Filter to a single agent
        - name: since
          in: query
          required: false
          schema:
            type: integer
          description: Return only entries with created_at >= this Unix timestamp (inclusive; paginating clients should use last_seen + 1 to avoid re-fetching the boundary row)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum rows to return (capped at 200)
      responses:
        "200":
          description: History rows, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlackboardHistoryRow"
              example:
                - id: 1
                  agent_id: "agent-a"
                  task_ref: "task-001"
                  status: "active"
                  summary: "Started"
                  created_at: 1700000000
                - id: 2
                  agent_id: "agent-a"
                  task_ref: "task-001"
                  status: "done"
                  summary: "Finished"
                  created_at: 1700001000

  # ---- Daily Log ----------------------------------------------------------

  /daily-log:
    get:
      tags: [daily-log]
      operationId: getDailyLog
      summary: Read daily log for an agent and date
      parameters:
        - name: agent
          in: query
          schema:
            type: string
          description: Defaults to MAIN_AGENT_ID
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: ISO date (YYYY-MM-DD), defaults to today
      responses:
