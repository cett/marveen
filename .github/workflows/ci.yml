name: CI

on:
  push:
    branches: [develop, 'feature/pg-p1-*']
  pull_request:
    branches: [develop, 'feature/pg-p1-*']

# A new push to a pull request supersedes the run still going on its previous
# head: cancel that one. A push to develop/main gets a group of its own (its
# sha): a shared group would let a newer push silently drop a pending run, and
# its commits would never be checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Security audit (tools/eslint lint toolchain, advisory)
        # The isolated lint toolchain has its own lock, so the root audit does not see it. A high advisory
        # there is shown as a warning annotation and does not fail the build or block the (report-mode) lint.
        run: npm audit --prefix tools/eslint --audit-level=high || echo "::warning title=tools/eslint audit::npm audit found high advisories in the lint toolchain lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages (semgrep + pip-audit)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scripts/gdocs-requirements.txt', 'scripts/watchdog-requirements.txt') }}-semgrep-1.176.1-pipaudit-2.10.1

      - name: pip-audit (Python script dependencies)
        env:
          PIP_AUDIT_VERSION: 2.10.1
        run: |
          python3 -m venv /tmp/pip-audit-venv
          /tmp/pip-audit-venv/bin/pip install --quiet "pip-audit==$PIP_AUDIT_VERSION"
          /tmp/pip-audit-venv/bin/pip-audit \
            -r scripts/gdocs-requirements.txt \
            -r scripts/watchdog-requirements.txt

      - name: Semgrep JS/TS security scan (report-only)
        # #816: best-ROI static analysis per #814's assessment -- npm audit
        # (above) only covers the dependency layer, this catches patterns in
        # our OWN code (injection, hardcoded-secret shapes, misconfigured
        # crypto/CORS, etc). Starts report-only (continue-on-error) until the
        # first findings are triaged; flip to blocking once that's done.
        continue-on-error: true
        env:
          SEMGREP_VERSION: 1.176.1
        run: |
          python3 -m venv /tmp/semgrep-venv
          /tmp/semgrep-venv/bin/pip install --quiet "semgrep==$SEMGREP_VERSION"
          /tmp/semgrep-venv/bin/semgrep scan \
            --config=p/security-audit --config=p/secrets \
            --config=p/javascript --config=p/typescript \
            --exclude=node_modules --exclude=dist --exclude=coverage \
            --json --output=semgrep-results.json \
            src web scripts
          python3 - <<'PYEOF'
          import json
          with open('semgrep-results.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          print(f"\nSemgrep: {len(results)} finding(s) (report-only, not blocking this build)\n")
          for r in results:
              path = r.get('path')
              line = r.get('start', {}).get('line')
              rule = r.get('check_id')
              msg = r.get('extra', {}).get('message', '').split('\n')[0]
              print(f"  {path}:{line}  {rule}\n    {msg}")
          PYEOF

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json
          retention-days: 30

  build-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the CHANGELOG-updated check diffs HEAD against the
          # PR base SHA, which the default shallow (depth=1) clone doesn't
          # contain -> "Invalid symmetric difference expression" (git can't
          # find a common ancestor). fetch-depth: 0 makes that diff reliable.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CSS design system guard
        run: bash scripts/css-guard.sh

      - name: Cache TypeScript incremental build info
        # dist/ must be cached together with .tsbuildinfo: a fresh runner has no
        # dist/ at all, and if tsc's incremental state (restored from cache)
        # believes the sources are already compiled, it emits nothing -- the
        # later `cp -r src/migrations dist/migrations` then fails because dist/
        # was never created. Caching both under the same key keeps them in sync.
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
            dist
          key: tsbuildinfo-${{ hashFiles('src/**/*.ts', 'tsconfig.json') }}

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Check SDK is up to date
        run: |
          npm run generate:sdk
          git diff --exit-code src/generated/api.ts || \
            (echo "SDK out of sync -- run 'npm run generate:sdk' and commit src/generated/api.ts" && exit 1)

      - name: Check API spec for breaking changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Pin to a specific release for reproducibility. Bump intentionally.
          # OASDIFF_VERSION is the git tag (with v); OASDIFF_ASSET_VERSION is
          # the same number without the v, which the release asset name embeds.
          OASDIFF_VERSION: v1.29.1
          OASDIFF_ASSET_VERSION: 1.29.1
        run: |
          if ! git show "$BASE_SHA:docs/openapi.yaml" > /tmp/openapi-base.yaml 2>/dev/null; then
            echo "docs/openapi.yaml not present in base -- new spec, skipping breaking change check."
            exit 0
          fi
          curl -sSfL \
            "https://github.com/oasdiff/oasdiff/releases/download/${OASDIFF_VERSION}/oasdiff_${OASDIFF_ASSET_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp oasdiff
          chmod +x /tmp/oasdiff
          if ! /tmp/oasdiff breaking /tmp/openapi-base.yaml docs/openapi.yaml; then
            echo ""
            echo "Breaking API changes detected in docs/openapi.yaml."
            echo "If the change is intentional, document it in CHANGELOG.md with"
            echo "a 'Removed' or 'Changed [BREAKING]' entry and get owner approval"
            echo "before merging (see docs/api-deprecation-policy.md)."
            exit 1
          fi

      - name: Check CHANGELOG updated for API changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          api_changed=$(echo "$changed" | grep -E '^(docs/openapi\.yaml|src/web/routes/|src/generated/api\.ts)' || true)
          if [ -n "$api_changed" ]; then
            changelog_changed=$(echo "$changed" | grep '^CHANGELOG\.md' || true)
            if [ -z "$changelog_changed" ]; then
              echo "API-related files changed but CHANGELOG.md was not updated."
              echo "Changed API files:"
              echo "$api_changed"
              echo "Run 'npm run changelog' and commit CHANGELOG.md."
              exit 1
            fi
          fi

      - name: Check commit subjects/bodies for internal kanban-rowid leaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_commit_subjects.py

  test:
    needs: build-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A pull request needs the history to tell what it changed (the vitest
          # step below diffs against the base); a push to develop needs none.
          # The values are strings on purpose: in an expression 0 is falsy, so
          # `cond && 0 || 1` would evaluate to 1 on a pull request too.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Stub external binaries (claude, tmux) for module-load resolution
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/claude"; chmod +x "$HOME/bin/claude"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/tmux"; chmod +x "$HOME/bin/tmux"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Python tests
        run: |
          fail=0
          for f in scripts/__tests__/*.test.py; do
            echo "== $f =="
            python3 "$f" || fail=1
          done
          exit $fail

      - name: SQLite dialect ratchet
        # No SQLite-specific SQL construct count may grow past
        # scripts/sqlite-dialect-baseline.json (PostgreSQL migration prep).
        run: python3 scripts/sqlite-dialect-ratchet.py

      - name: Non-TS direct DB access ratchet
        # Direct database access outside src/ (Python, shell, skills, templates)
        # may not grow past scripts/non-ts-db-access-baseline.json.
        run: python3 scripts/non-ts-db-access-ratchet.py

      - name: Raw SQL outside the db layer ratchet
        # .prepare( / getDb( / .transaction( outside src/db/ (src/ and scripts/) may not grow
        # past scripts/db-outside-sql-baseline.json, and no new file may add one (1017 Phase 1).
        run: python3 scripts/db-outside-sql-ratchet.py

      - name: Log message literal ratchet
        # A warn/error/fatal log call may not build a value into its message
        # (the application log export sends the message): scripts/log-message-literal-baseline.json.
        run: python3 scripts/log-message-literal-ratchet.py

      - name: Gmail send route ratchet
        # The Gmail REST send routes (the messages and drafts "send" paths) may be named
        # only in the files listed in scripts/gmail-send-route-ratchet.py ALLOWED (the
        # approval-gated sender, the self-only digest sender, the gate's recognition).
        run: python3 scripts/gmail-send-route-ratchet.py

      - name: Async lint self-test (fixture, FAILS the build)
        # The lint of the project tree below only reports, so a type the linter's TypeScript 6.0 cannot
        # resolve would silently report nothing while the TypeScript 7 build stays green. This step lints
        # tools/eslint/fixture/cases.ts and fails unless it yields exactly the findings marked in the file.
        run: |
          npm ci --prefix tools/eslint --ignore-scripts
          node tools/eslint/check-fixture.mjs

      - name: Async lint report (no-floating-promises, no-misused-promises, await-thenable, require-await)
        # REPORT MODE (1017 Phase 1): the findings are warnings and this step never fails the build
        # (continue-on-error); it prints the count per rule and the top files into the log. The rules
        # need the classic TypeScript API, which TypeScript 7 does not ship, so they run from the isolated
        # tools/eslint toolchain (TypeScript 6.0 for the linter only). See tools/eslint/eslint.config.mjs.
        continue-on-error: true
        run: |
          npm ci --prefix tools/eslint --ignore-scripts
          tools/eslint/node_modules/.bin/eslint -c tools/eslint/eslint.config.mjs -f json -o eslint-async.json src || true
          node tools/eslint/summarize.mjs eslint-async.json 15

      - name: Shell tests
        # #813: scripts/__tests__/*.test.sh (channels.sh / vault-inject /
        # vault-file-materializer / channels-mcp-unlock / channels-auth-probe,
        # etc.) previously only ran manually/locally -- this loop is the exact
        # pattern of the "Python tests" step above, just for the shell ones.
        run: |
          fail=0
          for f in scripts/__tests__/*.test.sh; do
            echo "== $f =="
            bash "$f" || fail=1
          done
          exit $fail

      - name: Vitest on the changed files
        # The full suite runs on push to develop (Coverage below). A pull request
        # runs `vitest related` on the TypeScript it changed, so a stale or broken
        # test fails the PR, not the develop that merged it. See the script for the
        # skip and whole-suite fallback rules.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-vitest-related.sh "$BASE_SHA"

      - name: Coverage
        # #894/B: the full vitest suite (with coverage instrumentation) now
        # only runs on push to develop. PR pass/fail already comes from
        # build-checks (build + typecheck); the coverage gate itself is a
        # develop-branch concern.
        if: github.event_name == 'push'
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
