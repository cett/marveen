name: CI

on:
  push:
    branches: [develop, 'feature/pg-p1-*', 'feature/pg-p2-*']
  pull_request:
    branches: [develop, 'feature/pg-p1-*', 'feature/pg-p2-*']

# A new push to a pull request supersedes the run still going on its previous
# head: cancel that one. A push to develop/main gets a group of its own (its
# sha): a shared group would let a newer push silently drop a pending run, and
# its commits would never be checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Security audit (tools/eslint lint toolchain, advisory)
        # The isolated lint toolchain has its own lock, so the root audit does not see it. A high advisory
        # there is shown as a warning annotation and does not fail the build or block the lint.
        run: npm audit --prefix tools/eslint --audit-level=high || echo "::warning title=tools/eslint audit::npm audit found high advisories in the lint toolchain lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages (semgrep + pip-audit)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scripts/gdocs-requirements.txt', 'scripts/watchdog-requirements.txt') }}-semgrep-1.176.1-pipaudit-2.10.1

      - name: pip-audit (Python script dependencies)
        env:
          PIP_AUDIT_VERSION: 2.10.1
        run: |
          python3 -m venv /tmp/pip-audit-venv
          /tmp/pip-audit-venv/bin/pip install --quiet "pip-audit==$PIP_AUDIT_VERSION"
          /tmp/pip-audit-venv/bin/pip-audit \
            -r scripts/gdocs-requirements.txt \
            -r scripts/watchdog-requirements.txt


  build-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the CHANGELOG-updated check diffs HEAD against the
          # PR base SHA, which the default shallow (depth=1) clone doesn't
          # contain -> "Invalid symmetric difference expression" (git can't
          # find a common ancestor). fetch-depth: 0 makes that diff reliable.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: CSS design system guard
        run: bash scripts/css-guard.sh

      - name: Cache TypeScript incremental build info
        # dist/ must be cached together with .tsbuildinfo: a fresh runner has no
        # dist/ at all, and if tsc's incremental state (restored from cache)
        # believes the sources are already compiled, it emits nothing -- the
        # later `cp -r src/migrations dist/migrations` then fails because dist/
        # was never created. Caching both under the same key keeps them in sync.
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
            dist
          key: tsbuildinfo-${{ hashFiles('src/**/*.ts', 'tsconfig.json') }}

      - name: Build
        run: |
          npm run build
          # the PG runner reads dist/migrations-pg next to the compiled module; tsc does not emit .sql
          test -n "$(ls dist/migrations-pg/*.sql 2>/dev/null)"

      - name: Type check
        run: npm run typecheck

      - name: Check SDK is up to date
        run: |
          npm run generate:sdk
          git diff --exit-code src/generated/api.ts || \
            (echo "SDK out of sync -- run 'npm run generate:sdk' and commit src/generated/api.ts" && exit 1)

      - name: Check API spec for breaking changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Pin to a specific release for reproducibility. Bump intentionally.
          # OASDIFF_VERSION is the git tag (with v); OASDIFF_ASSET_VERSION is
          # the same number without the v, which the release asset name embeds.
          OASDIFF_VERSION: v1.29.1
          OASDIFF_ASSET_VERSION: 1.29.1
        run: |
          if ! git show "$BASE_SHA:docs/openapi.yaml" > /tmp/openapi-base.yaml 2>/dev/null; then
            echo "docs/openapi.yaml not present in base -- new spec, skipping breaking change check."
            exit 0
          fi
          curl -sSfL \
            "https://github.com/oasdiff/oasdiff/releases/download/${OASDIFF_VERSION}/oasdiff_${OASDIFF_ASSET_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /tmp oasdiff
          chmod +x /tmp/oasdiff
          if ! /tmp/oasdiff breaking /tmp/openapi-base.yaml docs/openapi.yaml; then
            echo ""
            echo "Breaking API changes detected in docs/openapi.yaml."
            echo "If the change is intentional, document it in CHANGELOG.md with"
            echo "a 'Removed' or 'Changed [BREAKING]' entry and get owner approval"
            echo "before merging (see docs/api-deprecation-policy.md)."
            exit 1
          fi

      - name: Check CHANGELOG updated for API changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          api_changed=$(echo "$changed" | grep -E '^(docs/openapi\.yaml|src/web/routes/|src/generated/api\.ts)' || true)
          if [ -n "$api_changed" ]; then
            changelog_changed=$(echo "$changed" | grep '^CHANGELOG\.md' || true)
            if [ -z "$changelog_changed" ]; then
              echo "API-related files changed but CHANGELOG.md was not updated."
              echo "Changed API files:"
              echo "$api_changed"
              echo "Run 'npm run changelog' and commit CHANGELOG.md."
              exit 1
            fi
          fi

      - name: Check README fork-diff status is fresh
        if: github.event_name == 'pull_request'
        run: python3 scripts/readme-fork-diff-check.py

      - name: Check commit subjects/bodies for internal kanban-rowid leaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_commit_subjects.py

  vitest:
    # The vitest half of the old `test` job: the related-tests run on a pull request, the whole suite with
    # coverage on a push. Runs in parallel with `gates`; the aggregate `test` job below decides the context.
    needs: build-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A pull request needs the history to tell what it changed (the vitest
          # step below diffs against the base); a push to develop needs none.
          # The values are strings on purpose: in an expression 0 is falsy, so
          # `cond && 0 || 1` would evaluate to 1 on a pull request too.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # The classic TypeScript API (6.0) of the isolated tools/eslint toolchain, which TypeScript 7 does not ship: the
        # QA delta-class tests count the awaits a delta adds through it (tools/qa/lib/common.mjs loadTypeScript). Without
        # it `awaitsAdded` is null and those tests fail; the `gates` job installs the same toolchain for its lints.
        run: |
          npm ci
          npm ci --prefix tools/eslint --ignore-scripts
      - name: Stub external binaries (claude, tmux) for module-load resolution
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/claude"; chmod +x "$HOME/bin/claude"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/tmux"; chmod +x "$HOME/bin/tmux"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Vitest on the changed files
        # The full suite runs on push to develop and to feature/pg-p1-* (Coverage below). A pull request
        # runs `vitest related` on the TypeScript it changed, so a stale or broken
        # test fails the PR, not the develop that merged it. See the script for the
        # skip and whole-suite fallback rules.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The time limit of the guard (scripts/vitest-guard.py) is 600 s for `related` and 1800 s for the whole suite.
          # A change in the database layer reaches nearly the whole suite through the import graph, so 600 s is too
          # little there: the limit is the whole-suite one (1800 s). The same tests run and a timeout still fails the
          # step, so the gate is not weaker; only the hang protection is as wide as the full run.
          VITEST_GUARD_SECS: '1800'
        run: bash scripts/ci-vitest-related.sh "$BASE_SHA"

      - name: Coverage
        # #894/B: the full vitest suite (with coverage instrumentation) now
        # only runs on push to develop and to feature/pg-p1-*. PR pass/fail already
        # comes from build-checks (build + typecheck); the coverage gate itself is a
        # concern of those pushes.
        if: github.event_name == 'push'
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  gates:
    # The static gates of the old `test` job: the Python and shell tests, the five ratchets, the async lint and
    # its self-tests. They do not need the vitest run, so they run in parallel with `vitest`.
    needs: build-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # A pull request needs the history to tell what it changed (the vitest
          # step below diffs against the base); a push to develop needs none.
          # The values are strings on purpose: in an expression 0 is falsy, so
          # `cond && 0 || 1` would evaluate to 1 on a pull request too.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Stub external binaries (claude, tmux) for module-load resolution
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/claude"; chmod +x "$HOME/bin/claude"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/tmux"; chmod +x "$HOME/bin/tmux"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install zsh (the second shell oracle of the secret-read gate tests)
        # The runner has no zsh. The gate tests run their cells in bash AND zsh (the Bash tool's shell is zsh), and a cell that only
        # zsh proves would otherwise have no oracle on Linux.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          zsh --version
      - name: Changed paths (scripts group)
        # scripts/ci-changed-paths.sh answers true or false; true whenever it cannot tell (fail-safe). A skipped
        # step leaves the job a success: the required context `test` is decided by the job results, not by this step.
        id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # The decider comes from the BASE, never from the pull request's own checkout: a PR that rewrites the script
          # to answer false must not decide its own gates. A push never asks the script (true here). No base copy
          # (the base has no script yet) means true.
          if [ "$EVENT" = "push" ]; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          elif git show "$BASE_SHA:scripts/ci-changed-paths.sh" > "$RUNNER_TEMP/ci-changed-paths.sh" 2>/dev/null; then
            echo "scripts=$(bash "$RUNNER_TEMP/ci-changed-paths.sh" "$BASE_SHA" "$HEAD_SHA" scripts)" >> "$GITHUB_OUTPUT"
          else
            echo "scripts=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Python tests
        if: steps.paths.outputs.scripts == 'true'
        # scripts/run-python-tests.sh runs the scripts/__tests__/*.test.py files 4 at a time, the slowest
        # first, and prints them like the serial loop did (one "== file ==" block each, exit 1 on any failure).
        # REQUIRE_ZSH=1: the secret-read gate tests fail when zsh is missing or when any of their cells is skipped (no silent skip).
        env:
          REQUIRE_ZSH: '1'
        run: bash scripts/run-python-tests.sh -j 4

      - name: SQLite dialect ratchet
        # No SQLite-specific SQL construct count may grow past
        # scripts/sqlite-dialect-baseline.json (PostgreSQL migration prep).
        run: python3 scripts/sqlite-dialect-ratchet.py

      - name: Non-TS direct DB access ratchet
        # Direct database access outside src/ (Python, shell, skills, templates)
        # may not grow past scripts/non-ts-db-access-baseline.json.
        run: python3 scripts/non-ts-db-access-ratchet.py

      - name: Raw SQL outside the db layer ratchet
        # .prepare( / getDb( / .transaction( outside src/db/ (src/ and scripts/) may not grow
        # past scripts/db-outside-sql-baseline.json, and no new file may add one.
        run: python3 scripts/db-outside-sql-ratchet.py

      - name: Log message literal ratchet
        # A warn/error/fatal log call may not build a value into its message
        # (the application log export sends the message): scripts/log-message-literal-baseline.json.
        run: python3 scripts/log-message-literal-ratchet.py

      - name: Gmail send route ratchet
        # The Gmail REST send routes (the messages and drafts "send" paths) may be named
        # only in the files listed in scripts/gmail-send-route-ratchet.py ALLOWED (the
        # approval-gated sender, the self-only digest sender, the gate's recognition).
        run: python3 scripts/gmail-send-route-ratchet.py

      - name: Async lint self-test (fixture, FAILS the build)
        # The lint of the project tree below fails the build, so a type the linter's TypeScript 6.0 cannot
        # resolve would silently report nothing while the TypeScript 7 build stays green. This step lints
        # tools/eslint/fixture/cases.ts and fails unless it yields exactly the findings marked in the file.
        run: |
          npm ci --prefix tools/eslint --ignore-scripts
          node tools/eslint/check-fixture.mjs
          node tools/eslint/tests-ratchet-selftest.mjs

      - name: Db codemod self-test (fixture, FAILS the build)
        # tools/codemod moves a src/db module onto the async facade. It has its own toolchain (ts-morph with its
        # own TypeScript); the self-test runs it on tools/codemod/fixture/in and compares the result with fixture/out
        # (a few seconds). The build does not import it.
        run: |
          npm ci --prefix tools/codemod --ignore-scripts
          node tools/codemod/selftest.mjs

      - name: Async lint (no-floating-promises, no-misused-promises, await-thenable, require-await; FAILS the build)
        # ERROR MODE for the production src/: a finding fails the build. The rules need
        # the classic TypeScript API, which TypeScript 7 does not ship, so they run from the isolated
        # tools/eslint toolchain (TypeScript 6.0 for the linter only). See tools/eslint/eslint.config.mjs.
        # The summary is printed whether or not the lint passed.
        run: |
          npm ci --prefix tools/eslint --ignore-scripts
          status=0
          tools/eslint/node_modules/.bin/eslint -c tools/eslint/eslint.config.mjs -f json -o "$RUNNER_TEMP/eslint-async.json" src || status=$?
          node tools/eslint/summarize.mjs "$RUNNER_TEMP/eslint-async.json" 15
          exit $status

      - name: Async lint ratchet for the tests (FAILS the build on a new finding)
        # The test files are still warnings (ESLINT_ASYNC_TESTS=1), but a finding above tools/eslint/tests-baseline.json
        # fails the build. no-floating-promises and await-thenable are at zero in the tests: a new one is a dropped
        # `await`, which leaves a negative assertion green on a run that has not finished. The summary is printed first.
        run: |
          ESLINT_ASYNC_TESTS=1 tools/eslint/node_modules/.bin/eslint -c tools/eslint/eslint.config.mjs -f json -o "$RUNNER_TEMP/eslint-async-tests.json" src || true
          node tools/eslint/summarize.mjs "$RUNNER_TEMP/eslint-async-tests.json" 15
          node tools/eslint/tests-ratchet.mjs "$RUNNER_TEMP/eslint-async-tests.json"

      - name: Shell tests
        if: steps.paths.outputs.scripts == 'true'
        # #813: scripts/__tests__/*.test.sh (channels.sh / vault-inject /
        # vault-file-materializer / channels-mcp-unlock / channels-auth-probe,
        # etc.) previously only ran manually/locally -- this loop is the exact
        # pattern of the "Python tests" step above, just for the shell ones.
        run: |
          fail=0
          for f in scripts/__tests__/*.test.sh; do
            echo "== $f =="
            bash "$f" || fail=1
          done
          exit $fail

  test:
    # The required context. It fails unless vitest and gates succeeded AND the PostgreSQL parity job is accounted for:
    # a skipped or cancelled job is a failure, a step skipped inside a job is still a success of that job.
    # pg-parity may be skipped only when pg-decide succeeded and answered false (nothing in the change touches the PG
    # layer). A pg-parity skipped because pg-decide died proves nothing, so that is red. The ruleset keeps its four
    # required names: pg-parity is not a fifth required check (a skipped required check counts as passing on GitHub).
    needs: [vitest, gates, pg-decide, pg-parity]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Both halves succeeded
        env:
          VITEST_RESULT: ${{ needs.vitest.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          PG_DECIDE_RESULT: ${{ needs.pg-decide.result }}
          PG_DECIDE_OUTPUT: ${{ needs.pg-decide.outputs.pg }}
          PG_PARITY_RESULT: ${{ needs.pg-parity.result }}
        run: |
          echo "vitest: $VITEST_RESULT, gates: $GATES_RESULT, pg-decide: $PG_DECIDE_RESULT (pg=$PG_DECIDE_OUTPUT), pg-parity: $PG_PARITY_RESULT"
          if [ "$VITEST_RESULT" != "success" ] || [ "$GATES_RESULT" != "success" ]; then
            echo "a needed job did not succeed (vitest or gates)" >&2
            exit 1
          fi
          # Exact string comparison, anything not listed is red (an empty output included).
          if [ "$PG_DECIDE_RESULT" != "success" ]; then
            echo "pg-decide did not succeed: whether pg-parity had to run is unknown" >&2
            exit 1
          fi
          if [ "$PG_DECIDE_OUTPUT" = "true" ] && [ "$PG_PARITY_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$PG_DECIDE_OUTPUT" = "false" ] && [ "$PG_PARITY_RESULT" = "skipped" ]; then
            exit 0
          fi
          echo "pg-parity is not accounted for: pg-decide answered '$PG_DECIDE_OUTPUT', pg-parity result '$PG_PARITY_RESULT'" >&2
          exit 1

  qa-scanners:
    # The two QA scanners of tools/qa on the lines a pull request adds (tools/qa/README.md). The QA review reads the
    # findings that are left instead of grepping for them: the artifact holds the JSON reports.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The scan diffs the pull request against its base.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # The project's types for the program the scanners build, and the classic TypeScript API
        # (6.0) from the isolated tools/eslint toolchain, which TypeScript 7 does not ship.
        run: |
          npm ci
          npm ci --prefix tools/eslint --ignore-scripts

      - name: Scanner self-test (fixture, FAILS the build)
        # Runs both scanners over tools/qa/fixture and fails unless they report exactly the lines
        # marked "expect:" there, so a scanner that stops seeing a construct is caught here.
        run: node tools/qa/check-scanners.mjs

      - name: Await-mutant list self-test (throwaway repository, FAILS the build)
        # The mutant list of tools/qa/await-mutants.mjs must hold exactly the awaits a commit added to a
        # source file, and applying a mutant must remove that one await. No test run, a second or two.
        run: node tools/qa/check-mutants.mjs

      - name: Vacuous not.toThrow on the added lines (FAILS the build)
        # expect(() => <Promise>).not.toThrow() cannot fail: the check is deterministic and the
        # tree has none, so a new one is a finding that fails the pull request.
        run: node tools/qa/vacuous-notthrow-scan.mjs --base "$BASE_SHA" --fail-on-findings > qa-vacuous-notthrow.json

      - name: Promise in a non-awaiting position on the added lines (report)
        # REPORT MODE: the scan is a heuristic (a null check on an in-flight promise is legitimate),
        # so the findings go to the job summary and the artifact and never fail the build.
        continue-on-error: true
        run: |
          node tools/qa/promise-misuse-scan.mjs --base "$BASE_SHA" > qa-promise-misuse.json
          node tools/qa/summarize.mjs qa-promise-misuse.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the scanner reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-scanner-reports
          path: qa-*.json
          if-no-files-found: ignore
          retention-days: 14

  pg-decide:
    # Decides whether pg-parity runs (scripts/ci-changed-paths.sh, group pg): on a pull request when the changed files
    # touch the PostgreSQL layer or the PG harness, or when the PR carries the label ci-full; always on a push to develop.
    # Fail-safe: the answer is true whenever it cannot be computed. pg-parity is not a required context of its own,
    # but the required context `test` aggregates it (it needs pg-decide and pg-parity, see the `test` job).
    runs-on: ubuntu-latest
    outputs:
      pg: ${{ steps.decide.outputs.pg }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-full') && '1' || '0' }}
        run: |
          # The decider comes from the BASE, never from the pull request's own checkout: a PR that rewrites the script
          # to answer false must not decide its own gates. A push never asks the script (true here). No base copy
          # (the base has no script yet) means true.
          if [ "$EVENT" = "push" ]; then
            echo "pg=true" >> "$GITHUB_OUTPUT"
          elif git show "$BASE_SHA:scripts/ci-changed-paths.sh" > "$RUNNER_TEMP/ci-changed-paths.sh" 2>/dev/null; then
            echo "pg=$(bash "$RUNNER_TEMP/ci-changed-paths.sh" "$BASE_SHA" "$HEAD_SHA" pg)" >> "$GITHUB_OUTPUT"
          else
            echo "pg=true" >> "$GITHUB_OUTPUT"
          fi

  pg-parity:
    needs: pg-decide
    if: needs.pg-decide.outputs.pg == 'true'
    # The PostgreSQL tests (src/**/*.pg.test.ts, `npm run test:pg`): the baseline in src/migrations-pg/ against the
    # SQLite migration chain, its mutants, and the PG test harness. They need a server, so they live outside the
    # default vitest run; this job gives them a throwaway PostgreSQL 16 service container.
    # A missing or unreachable server fails the job, it never skips the tests. No other job depends on it, but the
    # required context `test` aggregates it: a red pg-parity is a red `test`, a flaky service container is a re-run.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      MARVEEN_PG_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # The required context `test` aggregates this job, so a network flake of the install (the onnxruntime-node binary
        # download times out now and then) would block a merge. Three attempts with a short wait; npm ci starts from an
        # empty node_modules each time. A real failure (a bad lockfile, a broken package) fails all three and stays red.
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt $attempt of 3)" >&2
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1

      - name: Install the PostgreSQL 16 client tools (pg_dump, pg_restore, psql)
        # The restore-drill test (scripts/__tests__/pg-restore-drill.pg.test.ts) runs the real pg_dump / pg_restore against the
        # service container, and refuses a client whose major is not the server's (16, the image above); a missing client is an
        # error there, never a skip. The runner image has no 16 client in a place the test looks (PATH or
        # /usr/lib/postgresql/16/bin), and the distribution repository does not reliably carry major 16, so the client comes from the
        # PostgreSQL project's own apt repository (PGDG), added with the script that postgresql-common ships for exactly that.
        # Keep the major here equal to the service image's major. Three attempts like the npm step: this job is aggregated into
        # the required context `test`, and a mirror flake must not block a merge; a real failure (no package, wrong major) fails all
        # three and stays red. The last lines refuse any client that is not major 16, so a repository that answers with another
        # major can not turn the drill into a comparison against the wrong tools.
        run: |
          install_clients() {
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq postgresql-common &&
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y &&
            sudo apt-get install -y -qq postgresql-client-16
          }
          for attempt in 1 2 3; do
            if install_clients; then
              break
            fi
            echo "client tools install failed (attempt $attempt of 3)" >&2
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done
          for tool in pg_dump pg_restore psql; do
            version="$(/usr/lib/postgresql/16/bin/$tool --version)"
            echo "$version"
            case "$version" in
              *" 16."*) ;;
              *) echo "$tool is not major 16: $version" >&2; exit 1 ;;
            esac
          done

      - name: PostgreSQL tests (baseline parity, harness)
        run: npm run test:pg

      - name: PostgreSQL module run (the useTestDb files of the ported list, MARVEEN_TEST_DB=pg)
        # the same files also run on SQLite in the default suite; the list is src/__tests__/helpers/pg-modules.ts
        run: npm run test:pg-modules

      - name: PostgreSQL module run as the app role (MARVEEN_TEST_PG_ROLE=app, row-level security applies)
        # the same ported list as the step above, but every statement runs as marveen_app (DML rights only, FORCE row-level
        # security): a module that works for the superuser and fails on a right, a DML grant or an ownership assumption as
        # the dashboard's role is red here. A call with no db context gets the SYSTEM context in this run, so the silent-empty
        # class (a context-less call that sees no row) is NOT caught here: that is the job of the bare cells in src/__tests__/pg/
        run: npm run test:pg-modules-app

      - name: PostgreSQL RLS overhead (report only)
        # The cost of the row-level-security policies of migration 0009 on this runner: per statement and policy class, the
        # context alone (policies off) against the policies on, against today's superuser call. One RLSPERF line per
        # measurement in the log (grep "RLSPERF"); it asserts nothing and never fails the job. Its own timeout, so it can
        # not eat the 25 minutes of the job. The always-on plan cells of the same file already ran in the first step.
        continue-on-error: true
        timeout-minutes: 10
        env:
          PG_RLS_PERF: '1'
          PG_RLS_PERF_QUERIES: '200'
          PG_RLS_PERF_ROWS: '20000'
        run: npx vitest run --config vitest.pg.config.ts --silent=false src/__tests__/pg/rls-perf.pg.test.ts -t timing
